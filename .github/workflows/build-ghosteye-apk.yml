name: Build Ghost Eye APK

on:
  push:
    branches: [ "main", "claude/convert-to-apk-57x0yb" ]
    paths: [ "ghost-eye-phone/**", ".github/workflows/build-ghosteye-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore ghost-eye-phone/release.keystore \
            -alias ghosteye \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ghosteye -keypass ghosteye \
            -dname "CN=Ghost Eye, OU=Mobile, O=Ghost Eye, L=NA, ST=NA, C=US"

      - name: Build signed release APK
        run: |
          cd ghost-eye-phone
          # Retry to ride out transient Maven Central rate limits (HTTP 429).
          n=0
          until [ "$n" -ge 3 ]; do
            gradle assembleRelease --no-daemon \
              -PAPI_BASE_URL=https://51.20.205.229 \
              -PGHOSTEYE_KEYSTORE="$PWD/release.keystore" \
              -PGHOSTEYE_KS_PASS=ghosteye \
              -PGHOSTEYE_KEY_ALIAS=ghosteye \
              -PGHOSTEYE_KEY_PASS=ghosteye && break
            n=$((n+1))
            echo "Build attempt $n failed; retrying in $((n*30))s..."
            sleep $((n*30))
          done
          [ "$n" -lt 3 ]

      - name: Rename APK
        run: cp ghost-eye-phone/app/build/outputs/apk/release/app-release.apk ghost-eye.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-eye-apk
          path: ghost-eye.apk
          retention-days: 30

      - name: Publish latest APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ghosteye-latest
          name: "Ghost Eye Phone — Latest APK (v9.3.2)"
          body: |
            Ghost Eye Phone Android app (v9.3.2, single-user locked mode), signed release build.

            Server: https://51.20.205.229

            Install: download `ghost-eye.apk` below, open it on your phone, and allow installation from unknown sources.
          files: ghost-eye.apk
          prerelease: false
          make_latest: true
