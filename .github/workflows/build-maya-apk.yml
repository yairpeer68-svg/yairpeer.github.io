name: Build Maya APK

on:
  push:
    branches: [ "main", "claude/maya-hospital-ai-assistant-uiqquz" ]
    paths: [ "maya-android/**", ".github/workflows/build-maya-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: cd maya-android && gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp maya-android/app/build/outputs/apk/debug/app-debug.apk maya.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-apk
          path: maya.apk
          retention-days: 30

      - name: Publish latest APK as release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maya-latest
          name: "מאיה — גרסה אחרונה (APK)"
          body: |
            👩‍⚕️ הגרסה האחרונה של אפליקציית מאיה לאנדרואיד — המסייעת האישית של המטופל המאושפז.

            **התקנה:** הורד את `maya.apk` מלמטה, פתח אותו בטלפון או בטאבלט ואשר התקנה ממקור לא מוכר.

            בהפעלה הראשונה האפליקציה תבקש הרשאה למיקרופון — היא נדרשת כדי שמאיה תוכל להקשיב. אפשר גם לעבוד בהקלדה בלבד.
          files: maya.apk
          prerelease: false
          make_latest: false
