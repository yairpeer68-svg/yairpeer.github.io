name: Build Magen APK

on:
  push:
    branches: [ "claude/general-review-ymfmyo", "main" ]
    paths: [ "magen-android/**", ".github/workflows/build-magen-apk.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-magen-${{ hashFiles('magen-android/**/*.gradle*') }}

      - name: Run unit tests
        run: cd magen-android && gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: cd magen-android && gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magen-debug-apk
          path: magen-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
