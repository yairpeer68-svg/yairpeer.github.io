name: Build Magen APK

on:
  push:
    branches: [ "claude/general-review-ymfmyo", "main" ]
    paths: [ "magen-android/**", ".github/workflows/build-magen-apk.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-magen-${{ hashFiles('magen-android/**/*.gradle*') }}

      # בדיקה מהירה (שניות) שתופסת שגיאות לפני שמתחילים בנייה ארוכה:
      # הפניות למשאבים שלא קיימים, רכיבי מניפסט בלי מחלקה, סוגריים לא
      # מאוזנים, מחרוזות כפולות, ומסכי מערכת שנפתחים בלי הגנה מפני קריסה.
      - name: Verify code (verify.py)
        run: cd magen-android && python3 verify.py

      - name: Run unit tests
        run: cd magen-android && gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: cd magen-android && gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magen-debug-apk
          path: magen-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # קישור התקנה ישיר: מפרסם את ה-APK כ-Release עם תג יציב, כך שיש
      # כתובת קבועה וניתנת-להתקנה מהטלפון (בלי התחברות ובלי zip).
      - name: Prepare APK for release
        run: cp magen-android/app/build/outputs/apk/debug/*.apk shomer-habrit.apk

      - name: Publish Release
        if: github.ref == 'refs/heads/claude/general-review-ymfmyo'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "שומר הברית — גרסת בדיקה"
          prerelease: true
          files: shomer-habrit.apk
          body: |
            APK להתקנה ידנית (Debug build).

            התקנה: הורד את `shomer-habrit.apk`, אשר "התקנה ממקורות לא ידועים",
            ופתח את הקובץ. לאחר ההתקנה, המדריך באפליקציה ינחה אותך שלב-אחר-שלב.

            נבנה אוטומטית מ-commit ${{ github.sha }}.
