name: Build Magen APK

on:
  push:
    branches: [ "main", "claude/general-review-ymfmyo", "claude/improve-add-everything-q69v3z" ]
    paths: [ "magen-android/**", ".github/workflows/build-magen-apk.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-magen-${{ hashFiles('magen-android/**/*.gradle*') }}

      # בדיקה מהירה (שניות) שתופסת שגיאות לפני שמתחילים בנייה ארוכה:
      # הפניות למשאבים שלא קיימים, רכיבי מניפסט בלי מחלקה, סוגריים לא
      # מאוזנים, מחרוזות כפולות, ומסכי מערכת שנפתחים בלי הגנה מפני קריסה.
      # --strict — גם אזהרה מפילה את הבנייה.
      - name: Verify code (verify.py)
        run: cd magen-android && python3 verify.py --strict

      - name: Run unit tests
        run: cd magen-android && gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: |
          cd magen-android
          gradle assembleDebug --no-daemon --stacktrace \
            -PbuildId=${GITHUB_SHA::7}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magen-debug-apk
          path: magen-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # קישור התקנה ישיר: מפרסם את ה-APK כ-Release עם תג יציב, כך שיש
      # כתובת קבועה וניתנת-להתקנה מהטלפון (בלי התחברות ובלי zip).
      # שני עותקים: שם קבוע לנוחות, ושם ייחודי עם ה-commit כדי שמטמון של
      # דפדפן/CDN לא יוכל להגיש בטעות קובץ ישן.
      - name: Prepare APK for release
        run: |
          cp magen-android/app/build/outputs/apk/debug/*.apk shomer-habrit.apk
          cp shomer-habrit.apk "shomer-habrit-${GITHUB_SHA::7}.apk"

      # שים לב: התג והשמות זהים למה שכבר פורסם (dev-latest/shomer-habrit.apk),
      # כדי שקישור ההורדה בדף הנחיתה יישאר יציב ולא ייווצר תג מתחרה.
      - name: Publish Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/general-review-ymfmyo'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "שומר הברית — גרסת בדיקה"
          prerelease: true
          files: |
            shomer-habrit.apk
            shomer-habrit-*.apk
          body: |
            APK להתקנה ידנית (Debug build).

            **מזהה הבנייה: `${{ github.sha }}`**

            כדי לוודא שהותקנה הגרסה הנכונה: המסך הראשון במדריך מציג
            למטה `build XXXXXXX` — שבע התווים הראשונים של המזהה למעלה.

            אם הדפדפן מגיש קובץ ישן מהמטמון, הורד את הקובץ עם השם הייחודי
            (`shomer-habrit-<commit>.apk`) במקום.

            התקנה: הורד, אשר "התקנה ממקורות לא ידועים", ופתח את הקובץ.
