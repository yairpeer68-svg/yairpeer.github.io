name: Build AI Platform APK

on:
  push:
    branches: [ "main", "claude/review-everything-mdp8lq" ]
    paths: [ "ai-platform/android/**", ".github/workflows/build-aiplatform-apk.yml" ]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional server URL to bake in (e.g. https://api.example.com/api/v1). Leave empty and the app asks on first launch.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-platform/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.1'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build release APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          version="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)"
          build="$(grep '^version:' pubspec.yaml | cut -d'+' -f2)"
          defines="--dart-define=APP_VERSION=$version --dart-define=APP_BUILD_NUMBER=$build"
          if [ -n "$API_BASE_URL" ]; then
            defines="$defines --dart-define=API_BASE_URL=$API_BASE_URL"
            echo "Server baked in: $API_BASE_URL"
          else
            echo "No server baked in; the app asks on first launch."
          fi
          # No upload keystore is configured, so this is debug-signed: installable by
          # sideloading, but not publishable and not upgradable in place.
          flutter build apk --release $defines -PALLOW_UNSIGNED_RELEASE=true

      - name: Name the artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/ai-platform.apk"

      - name: Verify the APK is signed and installable
        run: |
          apk="$GITHUB_WORKSPACE/ai-platform.apk"
          sha256sum "$apk"
          # An unsigned APK builds cleanly and then cannot be installed on any device,
          # so the artifact is rejected here rather than shipped.
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk"
          unzip -p "$apk" AndroidManifest.xml | strings | grep -q 'com.aiplatform.app' \
            || { echo "::error::Package id missing from the manifest"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-platform-apk
          path: ai-platform.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-platform-latest
          name: "AI Platform — גרסה אחרונה (APK)"
          body: |
            🤖 **AI Platform 2.1.1** — לקוח אנדרואיד.

            **התקנה:** הורד את `ai-platform.apk`, פתח אותו בטלפון ואשר התקנה ממקור לא מוכר.

            **הפעלה ראשונה:** האפליקציה תבקש את כתובת השרת שלך. הזן את הדומיין
            (לדוגמה `api.example.com`) — היא תשלים לבד את הנתיב, תבדוק שהשרת עונה
            ותציג את הגרסה שזוהתה. נדרש HTTPS.

            כדי להתקין שרת: ראה `ai-platform/INSTALL-VPS-HE.md`.

            ⚠️ ה־APK חתום במפתח debug. הוא מותקן בסייד־לואד אך אינו ניתן לפרסום
            בחנות ולא לעדכון במקום. ליצירת מפתח חתימה — ראה `ai-platform/docs/ANDROID.md`.
          files: ai-platform.apk
          prerelease: false
          make_latest: false
