name: Sanegor Backend CI

on:
  push:
    branches: ["main", "claude/israeli-legal-ai-system-stm1oa"]
    paths: ["sanegor-backend/**", ".github/workflows/sanegor-backend.yml"]
  pull_request:
    paths: ["sanegor-backend/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: sanegor-backend

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sanegor-backend/requirements-dev.txt

      - name: Install tooling
        run: pip install ruff==0.8.4 mypy==1.14.0

      - name: Ruff lint
        run: ruff check app tests scripts

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Mypy
        # Type errors should be visible without blocking the pipeline while
        # third-party stubs are still incomplete.
        run: mypy app || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sanegor-backend/requirements-dev.txt

      - name: Install system dependencies
        # The document pipeline imports pytesseract and OpenCV at module level.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-heb poppler-utils fonts-noto-core

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-secret-key-long-enough-for-signing-tests-only
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          EMBEDDING_PROVIDER: hashing
          EMBEDDING_DIMENSIONS: "256"
          STORAGE_DIR: /tmp/sanegor-ci
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: sanegor-backend/coverage.xml
          retention-days: 7

  migrations:
    name: Migrations against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector is required by the initial migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sanegor
          POSTGRES_PASSWORD: sanegor
          POSTGRES_DB: sanegor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sanegor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sanegor-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        env:
          SECRET_KEY: ci-secret-key-long-enough-for-signing-tests-only
          POSTGRES_HOST: localhost
          POSTGRES_USER: sanegor
          POSTGRES_PASSWORD: sanegor
          POSTGRES_DB: sanegor
          EMBEDDING_DIMENSIONS: "1024"
        run: alembic upgrade head

      - name: Verify the schema is reversible
        env:
          SECRET_KEY: ci-secret-key-long-enough-for-signing-tests-only
          POSTGRES_HOST: localhost
          POSTGRES_USER: sanegor
          POSTGRES_PASSWORD: sanegor
          POSTGRES_DB: sanegor
          EMBEDDING_DIMENSIONS: "1024"
        run: alembic downgrade base && alembic upgrade head

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: sanegor-backend
          push: false
          load: true
          tags: sanegor-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # Boot the app with no database and confirm the liveness probe answers,
        # which proves the image's dependencies and entrypoint are sound.
        run: |
          docker run -d --name sanegor-ci -p 8000:8000 \
            -e SECRET_KEY=ci-secret-key-long-enough-for-signing-tests-only \
            -e DATABASE_URL=sqlite+aiosqlite:///:memory: \
            -e EMBEDDING_PROVIDER=hashing \
            sanegor-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live; then
              echo "\nimage is healthy"; exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy"
          docker logs sanegor-ci
          exit 1
