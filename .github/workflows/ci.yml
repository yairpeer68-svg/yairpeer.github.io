name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test/runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest dnspython requests
          # ruff is optional; install for linting but never block the build on style
          pip install ruff || true

      - name: Import check (every module registers cleanly)
        run: |
          python -c "import ghost_eye.modules; from ghost_eye.core import REGISTRY; print(len(REGISTRY), 'modules'); assert len(REGISTRY) > 0"

      - name: Byte-compile all sources
        run: python -m compileall -q ghost_eye

      - name: Run tests (unit + all-module smoke test)
        run: python -m pytest -q

      - name: Lint (non-blocking)
        run: ruff check ghost_eye || true

      - name: Type-check (advisory, non-blocking)
        run: |
          pip install mypy || true
          mypy ghost_eye/core.py ghost_eye/config.py || true
