[project]
name = "ai-platform-runner"
version = "2.1.1"
requires-python = ">=3.12,<3.14"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
# The runner deliberately uses a compact single-file style; E701/E702 are style-only.
ignore = ["E701", "E702", "B008"]
