[project]
name = "sanegor-backend"
version = "1.0.0"
description = "Sanegor — Israeli legal AI assistant backend (FastAPI + RAG + DeepSeek)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S101",   # asserts are fine in tests
    "RUF001", # ambiguous unicode — Hebrew strings trip this
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that exercise the full app through HTTP",
]
