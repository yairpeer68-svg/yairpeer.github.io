[project]
name = "sanegor-backend"
version = "1.0.0"
description = "Sanegor — Israeli legal AI assistant backend (FastAPI + RAG + DeepSeek)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S101",   # asserts are fine in tests
    "RUF001", # ambiguous unicode — every Hebrew string trips these
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies mutable field defaults per instance, so RUF012's ClassVar
# advice is wrong for schema models — applying it would turn fields into
# class attributes and break validation.
"app/schemas/*" = ["RUF012"]
"app/api/v1/routes/admin.py" = ["RUF012"]
# S105 flags identifiers such as `token_type` and `TOKEN_REFRESH` as hardcoded
# passwords. They are audit-action names and JWT claim keys, not secrets.
"app/core/security.py" = ["S105"]
"app/db/models/audit.py" = ["S105"]
"app/core/config.py" = ["S105"]
"app/schemas/auth.py" = ["S105"]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that exercise the full app through HTTP",
]
