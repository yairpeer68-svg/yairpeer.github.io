name: sanegor
description: סנגור — עוזר משפטי דיגיטלי לדין הישראלי
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # UI
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4+3
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1

  # Files
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  open_filex: ^4.5.0
  share_plus: ^10.1.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Voice input
  speech_to_text: ^7.0.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Heebo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Heebo-Bold.ttf
          weight: 700
