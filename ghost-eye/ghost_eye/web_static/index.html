<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Eye — reconnaissance console</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0d13">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ==========================================================================
   Ghost Eye console.
   Layout: a fixed rail of workspaces, a persistent command bar, one content
   region. Every backend capability is reachable from the rail — the previous
   console exposed 11 of 30 endpoints, which is why most of the product was
   invisible.
   ========================================================================== */
:root{
  --bg:#0a0d13; --surface:#10141d; --surface-2:#161b26; --surface-3:#1d2432;
  --line:#232b3a; --line-2:#303a4d; --line-3:#42506a;
  --ink:#e9eef7; --ink-2:#a8b4c8; --muted:#7b8699; --faint:#525c6f;
  --accent:#f0b545; --accent-2:#e09a2e; --accent-ink:#1a1204;
  --cyan:#5cc9d8; --violet:#a68bf0; --blue:#6aa9ff; --green:#41c48a;
  --crit:#ff5d63; --high:#ff934a; --med:#ecc94b; --low:#5fa8d3; --ok:#41c48a;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  --r:10px; --r-sm:7px; --r-lg:14px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -18px rgba(0,0,0,.75);
  --ring:0 0 0 3px rgba(240,181,69,.16);
  --rail:224px; --bar:58px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:13.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.hidden{display:none !important}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;
  border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:15px 16px;
  border-bottom:1px solid var(--line);flex-shrink:0}
.brand svg{width:30px;height:30px;flex:0 0 30px;
  filter:drop-shadow(0 0 8px rgba(240,181,69,.25))}
.brand b{font-family:var(--mono);font-size:13px;letter-spacing:.15em;
  text-transform:uppercase;display:block}
.brand .sub{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--faint)}
.nav{flex:1;overflow-y:auto;padding:10px 8px;min-height:0}
.navgrp{margin:14px 0 5px;padding:0 9px}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:var(--r-sm);color:var(--ink-2);cursor:pointer;width:100%;
  text-align:left;transition:background .12s,color .12s;position:relative}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem[aria-current="true"]{background:var(--surface-3);color:var(--ink);
  box-shadow:inset 2px 0 0 var(--accent)}
.navitem .ico{width:17px;text-align:center;flex:0 0 17px;opacity:.85;font-size:13px}
.navitem .badge{margin-left:auto;font-family:var(--mono);font-size:10px;
  background:var(--surface-3);border:1px solid var(--line-2);color:var(--muted);
  padding:1px 6px;border-radius:20px;min-width:20px;text-align:center}
.navitem .badge.alert{background:rgba(255,93,99,.14);border-color:rgba(255,93,99,.4);
  color:var(--crit)}
.railfoot{border-top:1px solid var(--line);padding:9px 12px;flex-shrink:0;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.cmdbar{height:var(--bar);flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);
  position:relative;z-index:20}
.tgt{flex:1;max-width:460px;position:relative;display:flex;align-items:center}
.tgt input{width:100%;background:var(--bg);border:1px solid var(--line-2);
  border-radius:var(--r-sm);padding:8px 11px 8px 30px;font-size:13px;outline:none}
.tgt input:focus{border-color:var(--accent);box-shadow:var(--ring)}
.tgt .at{position:absolute;left:11px;color:var(--faint);font-family:var(--mono);
  pointer-events:none}
.sel{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:8px 9px;outline:none;max-width:230px}
.sel:focus{border-color:var(--accent);box-shadow:var(--ring)}
.btn{background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink);
  padding:8px 14px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;
  transition:border-color .12s,background .12s;white-space:nowrap}
.btn:hover{border-color:var(--line-3);background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{background:rgba(255,93,99,.13);border-color:rgba(255,93,99,.45);color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:11px;font-weight:500}
.status{margin-left:auto;display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 7px}
.dot.run{background:var(--accent);animation:pulse 1.4s infinite}
.dot.done{background:var(--ok)} .dot.err{background:var(--crit)} .dot.stop{background:var(--high)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,181,69,.5)}
  70%{box-shadow:0 0 0 6px rgba(240,181,69,0)}100%{box-shadow:0 0 0 0 rgba(240,181,69,0)}}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);
  width:0;transition:width .3s ease;box-shadow:0 0 8px rgba(240,181,69,.5)}

.view{flex:1;overflow-y:auto;padding:20px 22px 60px;min-height:0}
.viewhead{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.viewhead h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.viewhead .why{color:var(--muted);font-size:12.5px;margin:0 0 18px;max-width:70ch;
  line-height:1.6}
.actions{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:12.5px;font-weight:650;letter-spacing:.01em;
  display:flex;align-items:center;gap:8px}
.card h3 .tag{font-family:var(--mono);font-size:9.5px;color:var(--muted);
  border:1px solid var(--line-2);padding:1px 6px;border-radius:20px;font-weight:500}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:26px;font-weight:650;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .n{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.stat.crit .v{color:var(--crit)} .stat.high .v{color:var(--high)}
.stat.med .v{color:var(--med)} .stat.ok .v{color:var(--ok)}
.stat.accent .v{color:var(--accent)}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;
  border-bottom:1px solid var(--line);background:var(--surface-2);
  position:sticky;top:0;white-space:nowrap;z-index:2}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.wrap{max-width:520px;word-break:break-word}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line-2);
  color:var(--ink-2);white-space:nowrap;font-weight:600;letter-spacing:.03em}
.pill.critical{background:rgba(255,93,99,.13);border-color:rgba(255,93,99,.42);color:var(--crit)}
.pill.high{background:rgba(255,147,74,.12);border-color:rgba(255,147,74,.4);color:var(--high)}
.pill.medium{background:rgba(236,201,75,.12);border-color:rgba(236,201,75,.38);color:var(--med)}
.pill.low{background:rgba(95,168,211,.12);border-color:rgba(95,168,211,.35);color:var(--low)}
.pill.ok,.pill.confirmed{background:rgba(65,196,138,.12);border-color:rgba(65,196,138,.38);color:var(--ok)}
.pill.muted{color:var(--muted)}
.pill.accent{background:rgba(240,181,69,.12);border-color:rgba(240,181,69,.4);color:var(--accent)}
.pill.cyan{background:rgba(92,201,216,.12);border-color:rgba(92,201,216,.36);color:var(--cyan)}

/* ---------- forms ---------- */
.field{margin-bottom:11px}
.field label{display:block;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--line-2);
  border-radius:var(--r-sm);padding:7px 9px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);box-shadow:var(--ring)}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
.check{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:12.5px}
.check input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}

/* ---------- module picker ---------- */
.picker{display:grid;grid-template-columns:150px 1fr;gap:0;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;background:var(--surface);height:330px}
.pickmode{border-right:1px solid var(--line);background:var(--surface-2);padding:7px}
.pickmode button{display:block;width:100%;text-align:left;padding:7px 10px;
  border-radius:var(--r-sm);color:var(--ink-2);font-size:12.5px}
.pickmode button[aria-current="true"]{background:var(--surface-3);color:var(--ink)}
.pickbody{padding:12px;overflow-y:auto;min-width:0}
.modlist{max-height:210px;overflow-y:auto;border:1px solid var(--line);
  border-radius:var(--r-sm);padding:5px;background:var(--bg)}
.catgrp{margin-bottom:5px}
.cathead{display:flex;align-items:center;gap:8px;padding:5px 7px;cursor:pointer;
  border-radius:var(--r-sm);background:var(--surface-2)}
.cathead .ct{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.mod{display:flex;align-items:center;gap:8px;padding:4px 7px 4px 22px;cursor:pointer;
  border-radius:var(--r-sm);font-size:12px}
.mod:hover{background:var(--surface-2)}
.mod .mid{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}

/* ---------- results stream ---------- */
.res{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;
  background:var(--surface);overflow:hidden}
.reshead{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;
  user-select:none}
.reshead:hover{background:var(--surface-2)}
.reshead .nm{font-weight:600;font-size:12.5px}
.reshead .cat{font-family:var(--mono);font-size:10px;color:var(--muted)}
.reshead .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.resbody{border-top:1px solid var(--line);padding:11px 13px;background:var(--bg);
  font-family:var(--mono);font-size:11.5px}
.kv{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:3px 14px;
  align-items:start}
.kv .k{color:var(--muted);word-break:break-word}
.kv .v{color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.kv .v.sev-critical{color:var(--crit)} .kv .v.sev-high{color:var(--high)}
.kv .v.sev-medium{color:var(--med)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.32;margin-bottom:14px}
.empty h2{color:var(--ink-2);font-size:15px;font-weight:600;margin:0 0 6px}
.empty p{margin:0 auto;max-width:46ch;font-size:12.5px;line-height:1.65}
.banner{border-radius:var(--r);padding:11px 14px;margin-bottom:14px;font-size:12.5px;
  border:1px solid var(--line-2);background:var(--surface-2);line-height:1.6}
.banner.warn{border-color:rgba(255,147,74,.45);background:rgba(255,147,74,.09)}
.banner.err{border-color:rgba(255,93,99,.45);background:rgba(255,93,99,.09)}
.banner.info{border-color:rgba(92,201,216,.35);background:rgba(92,201,216,.07)}
.note{color:var(--muted);font-size:11.5px;line-height:1.65;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line-2);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.bar-h{height:5px;background:var(--surface-3);border-radius:20px;overflow:hidden;margin-top:6px}
.bar-h i{display:block;height:100%;background:var(--accent);border-radius:20px}
code{font-family:var(--mono);font-size:11.5px;background:var(--surface-3);
  padding:1px 5px;border-radius:4px;color:var(--ink-2)}

/* ---------- modal ---------- */
.scrim{display:none;position:fixed;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(3px);
  z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:var(--shadow);width:min(560px,100%);max-height:85vh;overflow-y:auto;padding:20px}
.modal h2{margin:0 0 4px;font-size:15px}

/* ---------- RTL ---------- */
[dir="rtl"] .rail{border-right:none;border-left:1px solid var(--line)}
[dir="rtl"] .navitem[aria-current="true"]{box-shadow:inset -2px 0 0 var(--accent)}
[dir="rtl"] .navitem .badge,[dir="rtl"] .actions,[dir="rtl"] .status{margin-left:0;margin-right:auto}
[dir="rtl"] .tgt input{padding:8px 30px 8px 11px}
[dir="rtl"] .tgt .at{left:auto;right:11px}
[dir="rtl"] th,[dir="rtl"] td{text-align:right}
[dir="rtl"] .pickmode{border-right:none;border-left:1px solid var(--line)}
[dir="rtl"] .pickmode button{text-align:right}
[dir="rtl"] .mod{padding:4px 22px 4px 7px}
[dir="rtl"] .mod .mid,[dir="rtl"] .cathead .ct,[dir="rtl"] .reshead .sp{
  margin-left:0;margin-right:auto}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:80;
    transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .scrim:not(.hidden){display:block;z-index:70}
  [dir="rtl"] .rail{inset:0 0 0 auto;transform:translateX(100%)}
  [dir="rtl"] .rail.open{transform:none}
  .menubtn{display:inline-flex !important}
  .view{padding:15px 14px 60px}
  .picker{grid-template-columns:1fr;height:auto}
  .pickmode{display:flex;gap:5px;overflow-x:auto;border-right:none;
    border-bottom:1px solid var(--line)}
  .pickmode button{width:auto;white-space:nowrap}
}
.menubtn{display:none}
</style>
</head>
<body>
<div class="scrim hidden" id="scrim"></div>
<div class="shell">

  <!-- ================= RAIL ================= -->
  <aside class="rail" id="rail">
    <div class="brand">
      <svg viewBox="0 0 100 100" id="iris" aria-hidden="true"></svg>
      <div><b>Ghost&nbsp;Eye</b><span class="sub">console · <span id="ver">—</span></span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="navgrp eyebrow" data-i18n="nav.operate">Operate</div>
      <button class="navitem" data-view="scan"><span class="ico">◎</span><span data-i18n="nav.scan">Scan</span></button>
      <button class="navitem" data-view="live"><span class="ico">⟳</span><span data-i18n="nav.live">Live results</span><span class="badge" id="b-live">0</span></button>

      <div class="navgrp eyebrow" data-i18n="nav.analyse">Analyse</div>
      <button class="navitem" data-view="findings"><span class="ico">⚑</span><span data-i18n="nav.findings">Findings</span><span class="badge" id="b-find">0</span></button>
      <button class="navitem" data-view="fixorder"><span class="ico">▲</span><span data-i18n="nav.fixorder">Fix order</span><span class="badge" id="b-fix">0</span></button>
      <button class="navitem" data-view="anomalies"><span class="ico">◈</span><span data-i18n="nav.anomalies">Anomalies</span><span class="badge" id="b-anom">0</span></button>
      <button class="navitem" data-view="exploits"><span class="ico">☣</span><span data-i18n="nav.exploits">Exploit intel</span></button>
      <button class="navitem" data-view="risk"><span class="ico">▲</span><span data-i18n="nav.risk">Risk model</span></button>
      <button class="navitem" data-view="intel"><span class="ico">🕸</span><span data-i18n="nav.intel">Intelligence</span></button>

      <div class="navgrp eyebrow" data-i18n="nav.assets">Assets</div>
      <button class="navitem" data-view="inventory"><span class="ico">▦</span><span data-i18n="nav.inventory">Inventory</span></button>
      <button class="navitem" data-view="ports"><span class="ico">⋮⋮</span><span data-i18n="nav.ports">Ports</span></button>
      <button class="navitem" data-view="ipfilter"><span class="ico">☁</span><span data-i18n="nav.ipfilter">CDN / origin</span></button>
      <button class="navitem" data-view="csp"><span class="ico">⛨</span><span data-i18n="nav.csp">CSP assets</span></button>
      <button class="navitem" data-view="attribution"><span class="ico">⌗</span><span data-i18n="nav.attribution">Attribution</span></button>

      <div class="navgrp eyebrow" data-i18n="nav.trust">Trust</div>
      <button class="navitem" data-view="verdicts"><span class="ico">⚖</span><span data-i18n="nav.verdicts">Verdicts</span><span class="badge" id="b-verd">0</span></button>
      <button class="navitem" data-view="opsec"><span class="ico">👁</span><span data-i18n="nav.opsec">OPSEC</span></button>
      <button class="navitem" data-view="compliance"><span class="ico">§</span><span data-i18n="nav.compliance">Compliance</span></button>

      <div class="navgrp eyebrow" data-i18n="nav.manage">Manage</div>
      <button class="navitem" data-view="history"><span class="ico">◷</span><span data-i18n="nav.history">History &amp; trend</span></button>
      <button class="navitem" data-view="reports"><span class="ico">⇩</span><span data-i18n="nav.reports">Reports</span></button>
      <button class="navitem" data-view="schedules"><span class="ico">⏱</span><span data-i18n="nav.schedules">Schedules</span></button>
      <button class="navitem" data-view="settings"><span class="ico">⚙</span><span data-i18n="nav.settings">Settings</span></button>
    </nav>
    <div class="railfoot">
      <a class="btn sm" id="osintlink" href="/osint">🕸 OSINT graph</a>
      <button class="btn sm" id="langtoggle">🌐 <span id="langlbl">עברית</span></button>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <div class="cmdbar">
      <button class="btn sm menubtn" id="menubtn">☰</button>
      <div class="tgt">
        <span class="at">▸</span>
        <input id="target" placeholder="example.com  ·  1.2.3.4  ·  https://host:8443" autocomplete="off" spellcheck="false">
      </div>
      <select class="sel" id="quickProfile" title="Scan profile"></select>
      <button class="btn primary" id="runbtn" data-i18n="cmd.run">Run scan</button>
      <div class="status"><span class="dot" id="dot"></span><span id="statustxt" data-i18n="cmd.idle">Idle</span></div>
      <div class="prog" id="prog"></div>
    </div>
    <main class="view" id="view"></main>
  </div>
</div>

<script>
"use strict";
/* ==========================================================================
   API layer
   ========================================================================== */
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const $ = id => document.getElementById(id);
function hdrs(){ const h={"Content-Type":"application/json"}; if(TOKEN) h["X-Ghost-Token"]=TOKEN; return h; }
async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{...hdrs(), ...(opts.headers||{})}});
  const body = await r.json().catch(()=>({error:r.statusText}));
  if(!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
if(TOKEN) $("osintlink").href = "/osint?token=" + encodeURIComponent(TOKEN);

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ==========================================================================
   State
   ========================================================================== */
let META=null, JOB=null, SNAP=null, poll=null, MISSES=0, scanning=false;
let VIEW="scan", PICK="profile", expanded=new Set();
const CACHE={};                       // per-view fetched payloads

/* ==========================================================================
   i18n — English / Hebrew. Only chrome is translated; findings stay verbatim
   because a translated finding is a finding you can no longer grep for.
   ========================================================================== */
const I18N={
  he:{
    "nav.operate":"תפעול","nav.scan":"סריקה","nav.live":"תוצאות חיות",
    "nav.analyse":"ניתוח","nav.findings":"ממצאים","nav.fixorder":"סדר תיקון",
    "nav.anomalies":"חריגות","nav.exploits":"מודיעין ניצול",
    "nav.risk":"מודל סיכון","nav.intel":"מודיעין","nav.reports":"דוחות","nav.assets":"נכסים","nav.inventory":"מלאי","nav.ports":"פורטים",
    "nav.ipfilter":"CDN / מקור","nav.csp":"נכסי CSP","nav.attribution":"ייחוס",
    "nav.trust":"אמון","nav.verdicts":"פסיקות","nav.opsec":"אבטחת מבצע",
    "nav.compliance":"רגולציה","nav.manage":"ניהול","nav.history":"היסטוריה ומגמה",
    "nav.schedules":"תזמונים","nav.settings":"הגדרות",
    "cmd.run":"הרץ סריקה","cmd.idle":"ממתין",
  }
};
let LANG = (()=>{ try{ return localStorage.getItem("ge_lang")||"en"; }catch(e){ return "en"; } })();
function t(key, fallback){ return (LANG!=="en" && I18N[LANG] && I18N[LANG][key]) || fallback; }
function applyLang(){
  document.documentElement.dir = LANG==="he" ? "rtl" : "ltr";
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.getAttribute("data-i18n");
    if(LANG!=="en" && I18N[LANG] && I18N[LANG][k]) el.textContent=I18N[LANG][k];
  });
  $("langlbl").textContent = LANG==="he" ? "English" : "עברית";
}
$("langtoggle").onclick = ()=>{
  LANG = LANG==="he" ? "en" : "he";
  try{ localStorage.setItem("ge_lang", LANG); }catch(e){}
  location.reload();
};

/* ==========================================================================
   Iris mark
   ========================================================================== */
(function iris(){
  const svg=$("iris"); if(!svg) return;
  const NS="http://www.w3.org/2000/svg";
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);
    for(const k in a) e.setAttribute(k,a[k]); return e;};
  svg.appendChild(mk("circle",{cx:50,cy:50,r:46,fill:"none",
    stroke:"#2a3448","stroke-width":2}));
  for(let i=0;i<28;i++){
    const a=i/28*Math.PI*2, r1=30, r2=42;
    svg.appendChild(mk("line",{x1:50+Math.cos(a)*r1,y1:50+Math.sin(a)*r1,
      x2:50+Math.cos(a)*r2,y2:50+Math.sin(a)*r2,stroke:"#f0b545",
      "stroke-width":1.6,opacity:.32+.5*Math.abs(Math.sin(a*2))}));
  }
  svg.appendChild(mk("circle",{cx:50,cy:50,r:15,fill:"#0a0d13",
    stroke:"#f0b545","stroke-width":2.5}));
  svg.appendChild(mk("circle",{cx:50,cy:50,r:6,fill:"#f0b545"}));
})();

/* ==========================================================================
   Navigation
   ========================================================================== */
$("nav").addEventListener("click", e=>{
  const b=e.target.closest(".navitem"); if(!b) return;
  go(b.dataset.view);
  setDrawer(false);
});
function setDrawer(open){
  $("rail").classList.toggle("open", open);
  $("scrim").classList.toggle("hidden", !open);
  document.body.classList.toggle("drawer", open);
}
$("menubtn").onclick = ()=> setDrawer(!$("rail").classList.contains("open"));
$("scrim").onclick = ()=> setDrawer(false);

function go(view){
  VIEW=view;
  document.querySelectorAll(".navitem").forEach(b=>
    b.setAttribute("aria-current", b.dataset.view===view ? "true" : "false"));
  try{ location.hash = view; }catch(e){}
  render();
}

/* ==========================================================================
   View shell helpers
   ========================================================================== */
function head(title, why, actions){
  return `<div class="viewhead"><h1>${esc(title)}</h1>
    ${actions?`<div class="actions">${actions}</div>`:""}</div>
    ${why?`<p class="why">${why}</p>`:""}`;
}
function needScan(what){
  return `<div class="empty">
    <h2>No scan loaded</h2>
    <p>${esc(what)} is computed from a scan's results. Run one from
    <b>Scan</b>, or open a previous run from <b>History</b>.</p></div>`;
}
function loading(){ return `<div class="empty"><span class="spin"></span>
  <p style="margin-top:12px">Working…</p></div>`; }
function errBox(msg){ return `<div class="banner err">${esc(msg)}</div>`; }
function noteBox(text){ return text?`<div class="note">${esc(text)}</div>`:""; }

/** Fetch a job sub-resource, render through `fn`, cache per job. */
async function jobView(sub, fn, opts={}){
  if(!JOB) return set(needScan(opts.what||sub));
  const key=JOB+":"+sub;
  if(CACHE[key] && !opts.fresh) return set(fn(CACHE[key]));
  set(loading());
  try{
    CACHE[key] = await api(`/api/job/${encodeURIComponent(JOB)}/${sub}`);
    if(VIEW===opts.view) set(fn(CACHE[key]));
  }catch(e){
    if(VIEW===opts.view) set(errBox(e.message));
  }
}
function set(html){ $("view").innerHTML=html; }

/* ==========================================================================
   Views
   ========================================================================== */
const VIEWS={};

/* ---------- Scan ---------- */
VIEWS.scan = ()=>{
  const profiles = META ? Object.keys(META.profiles).sort() : [];
  const cats = META ? Object.keys(META.categories).sort() : [];
  set(head("Scan",
    "Pick what to run and how hard to push. Everything below is also a CLI flag — "+
    "the console and <code>ghost_eye.py</code> drive the same engine.") + `
  <div class="grid g2">
    <div class="card">
      <h3>Selection <span class="tag" id="selcount">—</span></h3>
      <div class="picker">
        <div class="pickmode" id="pickmode">
          <button data-mode="profile">Profile</button>
          <button data-mode="category">Category</button>
          <button data-mode="modules">Modules</button>
          <button data-mode="all">Everything</button>
        </div>
        <div class="pickbody" id="pickbody"></div>
      </div>
    </div>

    <div class="card">
      <h3>Engine</h3>
      <div class="row">
        <div class="field"><label>Timeout (s)</label><input type="number" id="o-timeout" value="15" min="1"></div>
        <div class="field"><label>Parallel modules</label><input type="number" id="o-parallel" value="4" min="1"></div>
        <div class="field"><label>Threads / module</label><input type="number" id="o-threads" value="10" min="1"></div>
      </div>
      <div class="row">
        <div class="field"><label>Rate (req/s, 0 = off)</label><input type="number" id="o-rate" value="0" min="0" step="0.5"></div>
        <div class="field"><label>Per-host rate</label><input type="number" id="o-rate-host" value="0" min="0" step="0.5"></div>
      </div>
      <div class="field"><label>User-Agent override</label><input type="text" id="o-ua" placeholder="(default)"></div>
      <label class="check"><input type="checkbox" id="o-cache"> Cache responses</label>
      <label class="check"><input type="checkbox" id="o-tor"> Route through Tor (127.0.0.1:9050)</label>
      <label class="check"><input type="checkbox" id="o-insecure"> Skip TLS verification</label>
      <label class="check"><input type="checkbox" id="o-deep"> Deep scan — fan out to discovered hosts</label>
    </div>

    <div class="card">
      <h3>Port scanning <span class="tag">portscan</span></h3>
      <div class="field"><label>Ports</label>
        <input type="text" id="o-ports" placeholder="top100">
        <div class="hint"><code>80,443</code> · <code>1-1024</code> · <code>top100</code> ·
          <code>all</code>, or a combination. A spec that cannot be honoured is an
          error, not an empty scan.</div></div>
      <div class="row">
        <div class="field"><label>Retries before "filtered"</label>
          <input type="number" id="o-scan-retries" value="1" min="0" max="5"></div>
        <div class="field"><label>Connects / second</label>
          <input type="number" id="o-scan-rate" value="0" min="0"></div>
      </div>
      <label class="check"><input type="checkbox" id="o-scan-all-addr"> Scan every resolved address (IPv4 + IPv6)</label>
      <div class="note">A timeout proves nothing on its own, so a silent port is
        retried before it is called filtered. Pacing is about accuracy too: a host
        that rate-limits you turns real open ports into false "filtered".</div>
    </div>

    <div class="card">
      <h3>Trust &amp; baseline</h3>
      <label class="check"><input type="checkbox" id="o-baseline-learn" checked>
        Teach the corpus baseline from this scan</label>
      <div class="hint">Scoring always runs before learning, so a host is never
        compared against a corpus that already contains its own scan.</div>
      <div class="field" style="margin-top:11px"><label>Alert webhook</label>
        <input type="text" id="o-alert" placeholder="https://hooks.slack.com/…"></div>
      <div id="baselineStat" class="note">…</div>
    </div>
  </div>`);

  const qp=$("quickProfile");
  if(META && !qp.dataset.filled){
    qp.innerHTML = profiles.map(p=>`<option value="${esc(p)}">${esc(p)} · ${META.profiles[p].length}</option>`).join("");
    qp.dataset.filled="1";
  }
  drawPicker(profiles, cats);
  $("pickmode").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    PICK=b.dataset.mode; drawPicker(profiles, cats);
  });
  api("/api/baseline").then(b=>{
    const el=$("baselineStat"); if(!el) return;
    el.textContent = b.ready
      ? `Baseline ready: ${b.corpus_hosts} hosts, ${b.distinct_fields} fields learned.`
      : `Baseline holds ${b.corpus_hosts} host(s) — needs ${b.min_corpus} before rarity means anything.`;
  }).catch(()=>{});
};

function drawPicker(profiles, cats){
  document.querySelectorAll("#pickmode button").forEach(b=>
    b.setAttribute("aria-current", b.dataset.mode===PICK ? "true":"false"));
  const body=$("pickbody"); if(!body) return;
  if(PICK==="profile"){
    body.innerHTML=`<div class="field"><label>Profile</label>
      <select id="profileSel">${profiles.map(p=>`<option value="${esc(p)}">${esc(p)} · ${META.profiles[p].length} modules</option>`).join("")}</select>
      <div class="hint">Curated module sets from <code>recipes.yaml</code>.</div></div>`;
  }else if(PICK==="category"){
    body.innerHTML=`<div class="field"><label>Category</label>
      <select id="categorySel">${cats.map(c=>`<option value="${esc(c)}">${esc(c)} · ${META.categories[c].length} modules</option>`).join("")}</select></div>`;
  }else if(PICK==="modules"){
    const byCat={};
    META.modules.forEach(m=>{(byCat[m.category]=byCat[m.category]||[]).push(m);});
    body.innerHTML=`<div class="field"><label>Filter</label>
      <input type="text" id="modsearch" placeholder="name or id…"></div>
      <div class="modlist" id="modlist">${Object.keys(byCat).sort().map(cat=>`
        <div class="catgrp" data-cat="${esc(cat)}">
          <label class="cathead"><input type="checkbox" class="catall" data-cat="${esc(cat)}">
            <span class="eyebrow">${esc(cat)}</span><span class="ct">${byCat[cat].length}</span></label>
          ${byCat[cat].map(m=>`<label class="mod" data-text="${esc((m.id+" "+m.name).toLowerCase())}">
            <input type="checkbox" class="modchk" value="${esc(m.id)}">
            <span>${esc(m.name)}</span><span class="mid">${esc(m.id)}</span></label>`).join("")}
        </div>`).join("")}</div>`;
    $("modsearch").oninput = e=>{
      const q=e.target.value.toLowerCase();
      document.querySelectorAll("#modlist .mod").forEach(el=>
        el.style.display = !q || el.dataset.text.includes(q) ? "" : "none");
    };
    body.addEventListener("change", e=>{
      if(e.target.classList.contains("catall")){
        const grp=e.target.closest(".catgrp");
        grp.querySelectorAll(".modchk").forEach(c=>c.checked=e.target.checked);
      }
      updateSelCount();
    });
  }else{
    body.innerHTML=`<div class="banner warn"><b>Everything</b> runs all
      ${META?META.modules.length:"—"} modules. That is a lot of traffic to one
      host — use a profile unless you mean it.</div>`;
  }
  updateSelCount();
}
function updateSelCount(){
  const el=$("selcount"); if(!el||!META) return;
  let n=0;
  if(PICK==="all") n=META.modules.length;
  else if(PICK==="profile"){ const s=$("profileSel"); n=s?(META.profiles[s.value]||[]).length:0; }
  else if(PICK==="category"){ const s=$("categorySel"); n=s?(META.categories[s.value]||[]).length:0; }
  else n=document.querySelectorAll(".modchk:checked").length;
  el.textContent = n+" modules";
}
function currentSelection(){
  if(PICK==="all") return {mode:"all"};
  if(PICK==="profile") return {mode:"profile", value:($("profileSel")||{}).value};
  if(PICK==="category") return {mode:"category", value:($("categorySel")||{}).value};
  return {mode:"modules", value:[...document.querySelectorAll(".modchk:checked")].map(c=>c.value)};
}

/* ---------- Live results ---------- */
VIEWS.live = ()=>{
  if(!SNAP) return set(needScan("Live results"));
  const s=SNAP, done=s.done||0, total=s.total||1;
  set(head(`Live — ${esc(s.target)}`,
    "Every module's raw output as it lands. Errors are expanded automatically: a "+
    "module that failed is a gap in coverage, not a blank line.",
    `<button class="btn sm" onclick="reload()">Refresh</button>`) + `
    <div class="grid g4" style="margin-bottom:14px">
      ${stat("Progress", `${done}/${total}`, s.status)}
      ${stat("Findings", (s.risk&&s.risk.findings||[]).length, s.risk?s.risk.risk_level:"")}
      ${stat("Errors", (s.results||[]).filter(r=>r.status==="error").length)}
      ${stat("Elapsed", (s.elapsed!=null?s.elapsed+"s":"—"))}
    </div>
    <div class="bar-h" style="margin-bottom:14px"><i style="width:${Math.round(100*done/total)}%"></i></div>
    <div id="stream"></div>`);
  renderStream(s);
};
function renderStream(s){
  const el=$("stream"); if(!el) return;
  const sev={};
  (s.risk&&s.risk.findings||[]).forEach(f=>{ sev[f.module+"::"+f.field]=f.severity; });
  el.innerHTML = (s.results||[]).map(r=>{
    const isErr = r.status==="error";
    const open = expanded.has(r.module) || isErr;
    const flat={}; flatten(r.data, "", flat);
    return `<div class="res">
      <div class="reshead" data-mod="${esc(r.module)}">
        <span class="nm">${esc(r.module)}</span>
        <span class="cat">${esc(r.target||"")}</span>
        <span class="sp">
          ${isErr?`<span class="pill critical">error</span>`:
            r.status==="empty"?`<span class="pill muted">empty</span>`:
            `<span class="pill ok">${Object.keys(flat).length} fields</span>`}
          <span class="mono" style="color:var(--faint)">${open?"▾":"▸"}</span>
        </span>
      </div>
      ${open?`<div class="resbody">${isErr
        ? `<span style="color:var(--crit)">${esc(r.error||"module errored")}</span>`
        : `<div class="kv">${Object.keys(flat).map(k=>{
            const sv = sev[r.module+"::"+k];
            return `<div class="k">${esc(k)}</div><div class="v${sv?" sev-"+sv:""}">${esc(flat[k])}</div>`;
          }).join("")}</div>`}</div>`:""}
    </div>`;
  }).join("") || `<div class="empty"><p>Waiting for the first module…</p></div>`;
  el.querySelectorAll(".reshead").forEach(h=> h.onclick = ()=>{
    const m=h.dataset.mod;
    expanded.has(m) ? expanded.delete(m) : expanded.add(m);
    renderStream(SNAP);
  });
}
function flatten(obj, prefix, out){
  if(obj===null||obj===undefined){ out[prefix||"value"]="—"; return; }
  if(Array.isArray(obj)){
    if(!obj.length){ out[prefix]="[]"; return; }
    if(obj.every(x=>typeof x!=="object")){ out[prefix]=obj.join("\n"); return; }
    obj.forEach((v,i)=>flatten(v, prefix?`${prefix}[${i}]`:`[${i}]`, out));
  }else if(typeof obj==="object"){
    const keys=Object.keys(obj);
    if(!keys.length){ out[prefix]="{}"; return; }
    keys.forEach(k=>flatten(obj[k], prefix?`${prefix}.${k}`:k, out));
  }else out[prefix]=String(obj);
}

/* ---------- Findings (with inline verdicts) ---------- */
VIEWS.findings = ()=> jobView("verdicts", d=>{
  const rows = d.findings||[];
  const c = d.counts||{};
  return head("Findings",
    "Severity, confidence and provenance for everything the scan flagged. "+
    "Rule on a finding once with <b>FP</b> or <b>Accept</b> and the ruling applies "+
    "to every later scan — until the value changes or the verdict expires.",
    `<button class="btn sm" onclick="reload()">Refresh</button>`) + `
    <div class="grid g4" style="margin-bottom:14px">
      ${stat("Critical", c.critical||0, "", "crit")}
      ${stat("High", c.high||0, "", "high")}
      ${stat("Medium", c.medium||0, "", "med")}
      ${stat("Withheld by verdicts", d.suppressed_count||0, "reviewable, not deleted")}
    </div>
    ${d.expired_count?`<div class="banner warn">${d.expired_count} verdict(s)
      have expired and no longer suppress anything — re-judge them.</div>`:""}
    ${rows.length?`<div class="tblwrap"><table>
      <thead><tr><th>Sev</th><th>Module</th><th>Field</th><th>Detail</th>
        <th>Confidence</th><th>Verdict</th><th></th></tr></thead>
      <tbody>${rows.map(f=>`<tr>
        <td><span class="pill ${esc(f.severity)}">${esc(f.severity)}</span></td>
        <td class="num">${esc(f.module)}</td>
        <td class="num" style="color:var(--ink-2)">${esc(f.field)}</td>
        <td class="wrap">${esc(f.detail)}</td>
        <td><span class="pill muted" title="${esc(f.provenance_label||"")}">${esc(f.confidence||"—")}</span></td>
        <td>${f.verdict?`<span class="pill ${f.verdict==="confirmed"?"confirmed":"muted"}">${esc(f.verdict)}${f.verdict_expired?" (expired)":""}</span>`:"—"}</td>
        <td style="white-space:nowrap">
          <button class="btn sm" onclick="rule('${esc(f.id)}','false_positive')">FP</button>
          <button class="btn sm" onclick="rule('${esc(f.id)}','accepted_risk')">Accept</button>
          <button class="btn sm" onclick="rule('${esc(f.id)}','confirmed')">Confirm</button>
        </td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty"><h2>Nothing flagged</h2><p>No finding crossed the
         severity threshold in this scan.</p></div>`}
    ${d.suppressed_count?`<h3 style="margin:22px 0 9px;font-size:13px">Withheld by your verdicts</h3>
      <div class="tblwrap"><table><thead><tr><th>Sev</th><th>Module</th><th>Detail</th>
      <th>Verdict</th><th>Reason</th><th></th></tr></thead><tbody>
      ${(d.suppressed||[]).map(f=>`<tr>
        <td><span class="pill ${esc(f.severity)}">${esc(f.severity)}</span></td>
        <td class="num">${esc(f.module)}</td><td class="wrap">${esc(f.detail)}</td>
        <td><span class="pill muted">${esc(f.verdict)}</span></td>
        <td class="wrap" style="color:var(--muted)">${esc(f.verdict_reason||"—")}</td>
        <td><button class="btn sm" onclick="unrule('${esc(f.id)}')">Reinstate</button></td>
      </tr>`).join("")}</tbody></table></div>`:""}
    ${noteBox(d.note)}`;
}, {view:"findings", what:"Findings"});

async function rule(id, verdict){
  const reason = prompt("Why? (recorded with the ruling)") ;
  if(reason===null) return;
  try{
    await api("/api/verdict",{method:"POST",
      body:JSON.stringify({id, verdict, reason})});
    delete CACHE[JOB+":verdicts"]; reload();
  }catch(e){ alert("Could not record the verdict: "+e.message); }
}
async function unrule(id){
  try{
    await api("/api/verdict",{method:"POST",
      body:JSON.stringify({id, verdict:"confirmed", reason:"reinstated from console"})});
    delete CACHE[JOB+":verdicts"]; reload();
  }catch(e){ alert(e.message); }
}

/* ---------- Fix order ---------- */
VIEWS.fixorder = ()=> jobView("fixorder", d=>
  head("Fix order",
    "Ranked by exploitation pressure (CISA KEV · public exploit · EPSS 30-day "+
    "forecast) times <i>observed</i> reachability, with CVSS modulating rather "+
    "than deciding. A reachable, actively-exploited medium outranks an "+
    "unreachable critical nobody is touching.",
    `<button class="btn sm" onclick="reload()">Refresh</button>`) + `
  <div class="grid g4" style="margin-bottom:14px">
    ${stat("CVEs found", d.cves_found||0)}
    ${stat("Exploited AND reachable", d.act_now_count||0, "fix these first", "crit")}
    ${stat("Exposure unobserved", d.unobserved_exposure||0, "ranked lower, not ruled safe")}
  </div>
  ${(d.act_now||[]).length?`<div class="banner err"><b>Act now:</b>
    ${d.act_now.map(a=>esc(a.cve)).join(", ")} — exploited in the wild and observed reachable.</div>`:""}
  ${(d.fix_order||[]).length?`<div class="tblwrap"><table>
    <thead><tr><th>#</th><th>CVE</th><th>Priority</th><th>Reachability</th>
      <th>Why it ranks here</th><th>EPSS</th><th>CVSS</th><th>Hosts</th></tr></thead>

function renderAnalyst(a){
  if(!a) return "";

    <span class="tag">rule-based, no LLM</span></h3>
    <ul style="margin:0;padding-left:18px;line-height:1.75">
    ${arr.slice(0,40).map(x=>`<li>${esc(typeof x==="object"?JSON.stringify(x):x)}</li>`).join("")}
    </ul></div>`;
}
function renderCorr(c){
  if(!c) return "";
  const rows = Array.isArray(c) ? c : (c.signals || c.links || []);
  if(!rows.length) return "";
  return `<div class="card" style="margin-bottom:13px"><h3>Correlated signals</h3>
    <div class="tblwrap"><table><tbody>
    ${rows.slice(0,40).map(r=>`<tr><td class="wrap">${esc(
      typeof r==="object" ? Object.entries(r).map(([k,v])=>k+"="+v).join("  ·  ") : r)}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}
function renderTimeline(t){
  if(!t) return "";
  const rows = Array.isArray(t) ? t : (t.events || []);
  if(!rows.length) return "";
  return `<div class="card" style="margin-bottom:13px"><h3>Timeline</h3>
    <div class="tblwrap"><table><thead><tr><th>When</th><th>Event</th></tr></thead>
    <tbody>${rows.slice(0,60).map(e=>`<tr>
      <td class="num" style="color:var(--muted)">${esc(e.ts||e.date||e.when||"")}</td>
      <td class="wrap">${esc(e.text||e.event||e.detail||JSON.stringify(e))}</td>
    </tr>`).join("")}</tbody></table></div></div>`;
}

/* Entity graph. State lives outside the renderer so filtering and focusing
   never re-fetch — a graph that reloads on every click is unusable. */
let KGSTATE={focus:null, hidden:new Set()};
function kgraph(kg){
  if(!kg || !(kg.nodes||[]).length) return "";
  const kinds=[...new Set(kg.nodes.map(n=>n.kind||n.type||"node"))].sort();
  return `<div class="card" style="margin-bottom:13px">
    <h3>Entity graph <span class="tag">${kg.nodes.length} nodes · ${(kg.edges||kg.links||[]).length} edges</span></h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      ${kinds.map(k=>`<button class="pill kgfilter" data-kind="${esc(k)}"
        data-on="${KGSTATE.hidden.has(k)?"0":"1"}">${esc(k)}</button>`).join("")}
      <button class="btn sm" data-kgreset="1">Reset</button>
    </div>
    <div id="kgbox">${kgSvg(kg)}</div></div>`;
}
function kgSvg(kg){
  const nodes=(kg.nodes||[]).filter(n=>!KGSTATE.hidden.has(n.kind||n.type||"node"));
  const edges=(kg.edges||kg.links||[]);
  const ids=new Set(nodes.map(n=>n.id||n.name));
  const W=760, H=Math.max(260, Math.min(520, 60+nodes.length*7));
  const pos={};
  nodes.forEach((n,i)=>{
    const a=i/Math.max(1,nodes.length)*Math.PI*2, r=Math.min(W,H)/2-45;
    pos[n.id||n.name]=[W/2+Math.cos(a)*r, H/2+Math.sin(a)*r];
  });
  const colour=k=>({domain:"#5cc9d8",ip:"#f0b545",host:"#6aa9ff",email:"#a68bf0",
    service:"#41c48a",tech:"#ecc94b"}[k]||"#7b8699");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;
    background:var(--bg);border:1px solid var(--line);border-radius:8px">
    ${edges.filter(e=>ids.has(e.source||e.from)&&ids.has(e.target||e.to)).slice(0,600)
      .map(e=>{const a=pos[e.source||e.from],b=pos[e.target||e.to];
        return a&&b?`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"
          stroke="#232b3a" stroke-width="1"/>`:"";}).join("")}
    ${nodes.slice(0,400).map(n=>{const id=n.id||n.name, p=pos[id];
      const k=n.kind||n.type||"node";
      const on = !KGSTATE.focus || KGSTATE.focus===id;
      return `<g data-kgnode="${esc(id)}" style="cursor:pointer;opacity:${on?1:.25}">
        <circle cx="${p[0]}" cy="${p[1]}" r="${KGSTATE.focus===id?7:4.5}"
          fill="${colour(k)}"/>
        <text x="${p[0]+8}" y="${p[1]+3.5}" font-size="9" fill="#a8b4c8"
          font-family="ui-monospace,monospace">${esc(String(id).slice(0,26))}</text>
      </g>`;}).join("")}
  </svg>`;
}
document.addEventListener("click", e=>{
  const node=e.target.closest("[data-kgnode]");
  if(node){
    const id=node.getAttribute("data-kgnode");
    KGSTATE.focus = KGSTATE.focus===id ? null : id;
    const d=CACHE[JOB+":intel"]; if(d) $("kgbox").innerHTML=kgUpdate(d);
    return;
  }
  const f=e.target.closest(".kgfilter");
  if(f){
    const k=f.dataset.kind;
    KGSTATE.hidden.has(k) ? KGSTATE.hidden.delete(k) : KGSTATE.hidden.add(k);
    f.dataset.on = KGSTATE.hidden.has(k) ? "0" : "1";
    const d=CACHE[JOB+":intel"]; if(d) $("kgbox").innerHTML=kgUpdate(d);
    return;
  }
  if(e.target.closest("[data-kgreset]")){
    KGSTATE={focus:null, hidden:new Set()};
    render();
  }
});
function kgUpdate(d){
  const kg=d.graph||d.knowledge_graph; return kg?kgSvg(kg):"";
}

              ["sarif","SARIF","for a code-scanning dashboard"],
              ["md","Markdown","for a ticket or a wiki"],
              ["csv","CSV","for a spreadsheet"],
              ["graphml","GraphML","for Gephi / yEd"]];
  set(head("Reports",
    "Every export the engine can produce for this scan. Screenshots are captured "+
    "on demand because they cost real time and traffic.",
    `<button class="btn sm" id="shotbtn">Capture screenshots</button>`) + `
    <div class="grid g2">${fmts.map(([f,name,why])=>`
      <div class="card"><h3>${esc(name)} <span class="tag">${esc(f)}</span></h3>
        <p style="color:var(--muted);margin:0 0 11px">${esc(why)}</p>
        <a class="btn" data-fmt="${esc(f)}" href="${link(f)}" target="_blank" rel="noopener">Download ↗</a>
      </div>`).join("")}</div>
    <div id="shotout" style="margin-top:14px"></div>`);
  $("shotbtn").onclick = async ()=>{
    $("shotout").innerHTML = loading();
    try{
      const d = await api(`/api/job/${encodeURIComponent(JOB)}/screenshots?max=8`);
      $("shotout").innerHTML = `<div class="banner info">Captured
        ${esc(d.captured!=null?d.captured:(d.shots||[]).length)} screenshot(s) —
        they are merged into the scan and appear in the Intelligence view.</div>`;
    }catch(e){ $("shotout").innerHTML = errBox(e.message); }
  };
};

/* ---------- Verdicts ---------- */
VIEWS.verdicts = async ()=>{
  set(loading());
  try{
    const d=await api("/api/verdicts");
    if(VIEW!=="verdicts") return;
    set(head("Standing verdicts",
      "Rulings you have made, applied to every later scan. A verdict fingerprints "+
      "the <i>value</i> you ruled on, so when the value changes the finding comes "+
      "back for judgement — a suppression that outlives the thing it was about is "+
      "worse than the noise it removed.") + `
      <div class="grid g4" style="margin-bottom:14px">
        ${stat("Verdicts", d.count||0)}
        ${stat("Expired", d.expired||0, "no longer suppress", d.expired?"med":"")}
      </div>
      ${(d.verdicts||[]).length?`<div class="tblwrap"><table>
        <thead><tr><th>ID</th><th>Verdict</th><th>Scope</th><th>Field</th>
          <th>Value ruled on</th><th>Reason</th><th>Expires</th></tr></thead>
        <tbody>${d.verdicts.map(v=>`<tr${v.expired?' style="opacity:.55"':""}>
          <td class="num">${esc(v.id)}</td>
          <td><span class="pill ${v.verdict==="confirmed"?"confirmed":"muted"}">${esc(v.verdict)}</span></td>
          <td class="num">${esc(v.scope)}</td>
          <td class="num">${esc(v.module)}.${esc(v.field)}</td>
          <td class="wrap">${esc(v.detail)}</td>
          <td class="wrap" style="color:var(--muted)">${esc(v.reason||"—")}</td>
          <td class="num">${esc((v.expires||"").slice(0,10))}${v.expired?" ⚠":""}</td>
        </tr>`).join("")}</tbody></table></div>`
        :`<div class="empty"><h2>No rulings yet</h2><p>Open <b>Findings</b> after a
          scan and mark anything that is not real. It will not come back — until
          the value changes or the ruling expires.</p></div>`}
      ${noteBox(d.note)}`);
  }catch(e){ if(VIEW==="verdicts") set(errBox(e.message)); }
};

/* ---------- History & trend ---------- */
VIEWS.history = async ()=>{
  set(loading());
  try{
    const d=await api("/api/history");
    if(VIEW!=="history") return;
    const scans=d.scans||d||[];
    set(head("History & trend",
      "Every stored scan. Open one to load its results into every analysis view.") +
      (scans.length?`<div class="tblwrap"><table>
        <thead><tr><th>Target</th><th>When</th><th>Risk</th><th>Modules</th><th></th></tr></thead>
        <tbody>${scans.map(s=>`<tr>
          <td class="num">${esc(s.target)}</td>
          <td class="num" style="color:var(--muted)">${esc((s.ts||"").replace("T"," ").slice(0,16))}</td>
          <td><span class="pill ${String(s.risk||"").toLowerCase()}">${esc(s.risk||"—")}</span></td>
          <td class="num">${esc(s.modules||"—")}</td>
          <td><a class="btn sm" href="/api/scan/${esc(s.id)}${TOKEN?"?token="+encodeURIComponent(TOKEN):""}" target="_blank" rel="noopener">Raw ↗</a></td>
        </tr>`).join("")}</tbody></table></div>`
        :`<div class="empty"><h2>No stored scans</h2>
          <p>Start the dashboard with <code>--db</code> to persist runs.</p></div>`));
  }catch(e){ if(VIEW==="history") set(errBox(e.message)); }
};

/* ---------- Schedules ---------- */
VIEWS.schedules = async ()=>{
  set(loading());
  try{
    const d=await api("/api/schedules");
    if(VIEW!=="schedules") return;
    const rows=d.schedules||d||[];
    set(head("Schedules",
      "Re-run a target on an interval and alert on change.") + `
      <div class="card" style="margin-bottom:14px"><h3>New schedule</h3>
        <div class="row">
          <div class="field"><label>Target</label><input type="text" id="schedTarget" placeholder="example.com"></div>
          <div class="field"><label>Every (minutes)</label><input type="number" id="schedInt" value="60" min="5"></div>
          <div class="field"><label>Alert webhook</label><input type="text" id="schedAlert" placeholder="https://…"></div>
        </div>
        <div class="row">
          <div class="field"><label>Report format</label>
            <select id="schedReport"><option value="">none</option>
              <option value="exec">executive HTML</option>
              <option value="intel">intelligence</option>
              <option value="json">JSON</option>
              <option value="sarif">SARIF</option></select></div>
          <div class="field"><label>Report webhook</label>
            <input type="text" id="schedReportHook" placeholder="where to POST the report"></div>
        </div>
        <button class="btn primary" id="schedAdd">Add schedule</button></div>
      ${rows.length?`<div class="tblwrap"><table>
        <thead><tr><th>Target</th><th>Interval</th><th>Next</th></tr></thead>
        <tbody>${rows.map(s=>`<tr><td class="num">${esc(s.target)}</td>
          <td class="num">${esc(s.interval||s.every||"—")}</td>
          <td class="num" style="color:var(--muted)">${esc(s.next||"—")}</td></tr>`).join("")}
        </tbody></table></div>`:`<p style="color:var(--muted)">No schedules yet.</p>`}`);
    $("schedAdd").onclick = async ()=>{
      try{
        await api("/api/schedule",{method:"POST",body:JSON.stringify({
          target:$("schedTarget").value.trim(),
          interval:+$("schedInt").value,
          alert_webhook:$("schedAlert").value.trim(),
          report_format:$("schedReport").value,
          report_webhook:$("schedReportHook").value.trim()})});
        VIEWS.schedules();
      }catch(e){ alert(e.message); }
    };
  }catch(e){ if(VIEW==="schedules") set(errBox(e.message)); }
};

/* ---------- Settings ---------- */
VIEWS.settings = async ()=>{
  set(head("Settings",
    "API keys are optional — every core capability works without one. Keys are "+
    "stored by the backend, never in the browser."));
  try{
    const k=await api("/api/keys");
    if(VIEW!=="settings") return;
    const keys=k.keys||{};
    $("view").insertAdjacentHTML("beforeend", `
      <div class="card"><h3>API keys <span class="tag">${esc(k.backend||"file")}</span></h3>
      <div class="tblwrap"><table><thead><tr><th>Service</th><th>Status</th><th>Set</th></tr></thead>
      <tbody>${Object.keys(keys).map(name=>`<tr>
        <td class="num">${esc(name)}</td>
        <td>${keys[name]?`<span class="pill ok">configured</span>`:`<span class="pill muted">not set</span>`}</td>
        <td><input type="text" class="keyin" data-name="${esc(name)}" placeholder="paste key…"
             style="background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;width:210px"></td>
      </tr>`).join("")}</tbody></table></div>
      <button class="btn primary" style="margin-top:11px" id="savekeys">Save keys</button></div>
      <div class="card" style="margin-top:13px"><h3>Backend</h3>
        <div class="mono" style="color:var(--ink-2)">Ghost Eye ${esc(META?META.version:"—")} ·
        ${META?META.modules.length:"—"} modules · ${META?Object.keys(META.profiles).length:"—"} profiles</div>
        <div class="note">Scope enforcement, backup/restore and metrics are served at
        <code>/api/scope</code>, <code>/api/backup</code> and <code>/api/metrics</code>.</div></div>`);
    $("savekeys").onclick = async ()=>{
      for(const el of document.querySelectorAll(".keyin")){
        const v=el.value.trim(); if(!v) continue;
        try{ await api("/api/keys",{method:"POST",
          body:JSON.stringify({name:el.dataset.name, value:v})}); el.value="";
        }catch(e){ alert(el.dataset.name+": "+e.message); }
      }
      VIEWS.settings();
    };
  }catch(e){ if(VIEW==="settings") $("view").insertAdjacentHTML("beforeend", errBox(e.message)); }
};

function stat(k, v, note, cls){
  return `<div class="stat ${cls||""}"><div class="k">${esc(k)}</div>
    <div class="v">${esc(v)}</div>${note?`<div class="n">${esc(note)}</div>`:""}</div>`;
}
function render(){ (VIEWS[VIEW]||VIEWS.scan)(); }
function reload(){ if(JOB) Object.keys(CACHE).forEach(k=>{ if(k.startsWith(JOB+":")) delete CACHE[k]; }); render(); }

/* ==========================================================================
   Scanning
   ========================================================================== */
$("runbtn").onclick = ()=> scanning ? stopScan() : startScan();
$("target").addEventListener("keydown", e=>{ if(e.key==="Enter" && !scanning) startScan(); });

function opt(id, dflt){ const el=$(id); return el ? el.value : dflt; }
function chk(id){ const el=$(id); return el ? el.checked : false; }

async function startScan(){
  const target=$("target").value.trim();
  if(!target){ $("target").focus(); return; }
  // when the Scan view is not mounted, fall back to the command-bar profile
  const sel = $("pickbody") ? currentSelection()
            : {mode:"profile", value:$("quickProfile").value};
  const options={
    timeout:+opt("o-timeout",15), parallel:+opt("o-parallel",4),
    threads:+opt("o-threads",10), rate:+opt("o-rate",0),
    rate_per_host:+opt("o-rate-host",0),
    cache:chk("o-cache"), insecure:chk("o-insecure"), tor:chk("o-tor"),
    deep:chk("o-deep"),
    user_agent:(opt("o-ua","")||"").trim() || undefined,
    alert_webhook:(opt("o-alert","")||"").trim(),
    ports:(opt("o-ports","")||"").trim(),
    scan_retries:+opt("o-scan-retries",1),
    scan_rate:+opt("o-scan-rate",0),
    scan_all_addresses:chk("o-scan-all-addr"),
  };
  let res;
  try{ res=await api("/api/scan",{method:"POST",
        body:JSON.stringify({target, selection:sel, options})}); }
  catch(e){ set(errBox("Scan rejected: "+e.message)+$("view").innerHTML); return; }
  JOB=res.job_id; SNAP=null; expanded=new Set();
  Object.keys(CACHE).forEach(k=>delete CACHE[k]);
  setScanning(true);
  go("live");
  poll=setInterval(tick,1000); tick();
}

async function stopScan(){
  if(!JOB) return;
  $("runbtn").disabled=true; $("statustxt").textContent="Stopping…";
  try{ await api(`/api/job/${JOB}/cancel`,{method:"POST"}); }catch(e){}
  tick();
}

async function tick(){
  if(!JOB) return;
  let s;
  try{ s=await api(`/api/job/${encodeURIComponent(JOB)}`); }
  catch(e){
    if(++MISSES>=5){ stopPoll(); $("statustxt").textContent="Backend unreachable";
      $("dot").className="dot err"; }
    return;
  }
  MISSES=0; SNAP=s;
  const done=s.done||0, total=s.total||1;
  $("prog").style.width = Math.round(100*done/total)+"%";
  $("b-live").textContent = done;
  $("b-find").textContent = (s.risk&&s.risk.findings||[]).length;
  if(VIEW==="live") renderStream(s);
  if(s.status!=="running"){
    stopPoll(); setScanning(false);
    const map={done:["done","Complete"],cancelled:["stop","Stopped"],error:["err","Error"]};
    const [cls,txt]=map[s.status]||["done","Done"];
    $("dot").className="dot "+cls;
    $("statustxt").textContent=`${txt} — ${s.target}`;
    $("prog").style.width="0%";
    refreshBadges();
    if(VIEW==="live") render();
  }
}
function stopPoll(){ if(poll){ clearInterval(poll); poll=null; } }
function setScanning(on){
  scanning=on;
  $("runbtn").textContent = on ? "Stop scan" : t("cmd.run","Run scan");
  $("runbtn").classList.toggle("primary", !on);
  $("runbtn").classList.toggle("danger", on);
  $("runbtn").disabled=false;
  $("dot").className = "dot" + (on?" run":"");
  if(on) $("statustxt").textContent="Scanning…";
}

/** Badge counts come from the analysis endpoints, so the rail tells you where
 *  to look without having to open every view. */
async function refreshBadges(){
  if(!JOB) return;
  const jobs = [
    ["fixorder","b-fix", d=>d.act_now_count||0, true],
    ["anomalies","b-anom", d=>d.anomaly_count||0, false],
  ];
  for(const [sub,id,pick,alert] of jobs){
    try{
      const d=await api(`/api/job/${encodeURIComponent(JOB)}/${sub}`);
      CACHE[JOB+":"+sub]=d;
      const n=pick(d); const el=$(id); if(!el) continue;
      el.textContent=n;
      el.classList.toggle("alert", alert && n>0);
    }catch(e){}
  }
  try{
    const v=await api("/api/verdicts");
    $("b-verd").textContent=v.count||0;
  }catch(e){}
}

/* ==========================================================================
   Boot
   ========================================================================== */
(async function boot(){
  applyLang();
  if("serviceWorker" in navigator){
    try{ navigator.serviceWorker.register("/sw.js"); }catch(e){}
  }
  try{
    META=await api("/api/meta");
    $("ver").textContent="v"+META.version;
  }catch(e){
    set(`<div class="banner err">Cannot reach the backend: ${esc(e.message)}.
      Is <code>ghost_eye_web.py</code> running${TOKEN?"":", and does it need a ?token="}?</div>`);
    return;
  }
  const start=(location.hash||"").replace("#","");
  go(VIEWS[start] ? start : "scan");
  try{ const v=await api("/api/verdicts"); $("b-verd").textContent=v.count||0; }catch(e){}
})();
</script>
