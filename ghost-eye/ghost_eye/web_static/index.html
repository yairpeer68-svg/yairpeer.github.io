/* #62 — redaction. Masks values, never the structure: you can still show what
   kind of finding it is without showing the value on a shared screen. */
function redact(text){
  if(!REDACT) return String(text);
  return String(text).replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/g, "«email»")
    .replace(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g, "«ip»")
    .replace(/\b[A-Za-z0-9-]+\.[A-Za-z]{2,}\b/g, "«host»")
    .replace(/[A-Za-z0-9_-]{24,}/g, "«secret»");
}
function download(text, mime, name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
async function sha256(text){
  try{
    const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return ""; }
}

/** #54 — assemble the chosen sections from what the console already fetched. */
async function buildReport(title, sections){
  const get = async sub => {
    const key=JOB+":"+sub;
    if(CACHE[key]) return CACHE[key];
    try{ return CACHE[key]=await api(`/api/job/${encodeURIComponent(JOB)}/${sub}`); }
    catch(e){ return null; }
  };
  const out=[`# ${title}`, "",
    `Target: ${redact((SNAP&&SNAP.target)||"")}`,
    `Generated: ${new Date().toISOString()}`,
    `Modules run: ${(SNAP&&SNAP.total)||0}`, ""];
  for(const sec of sections){
    if(sec==="summary"){
      const d=await get("intel");
      out.push("## Summary","", d?`Grade **${d.grade||"?"}**, risk ${d.risk_level||"?"}`
        :"(no intelligence available)","");
    }else if(sec==="findings"){
      const d=await get("verdicts");
      out.push("## Findings","");
      (d&&d.findings||[]).forEach(f=>out.push(
        `- **${f.severity}** \`${f.module}\` ${f.field}: ${redact(f.detail)} _(${f.confidence||"?"})_`));
      if(d&&d.suppressed_count) out.push("", `_${d.suppressed_count} withheld by standing verdicts._`);
      out.push("");
    }else if(sec==="fixorder"){
      const d=await get("fixorder");
      out.push("## Fix order","");
      (d&&d.fix_order||[]).slice(0,20).forEach((f,i)=>out.push(
        `${i+1}. **${f.cve}** priority ${f.priority} — ${f.reachability}; ${f.exploitation}`));
      out.push("");
    }else if(sec==="anomalies"){
      const d=await get("anomalies");
      out.push("## Anomalies","");
      (d&&d.anomalies||[]).slice(0,25).forEach(a=>out.push(
        `- ${a.module}.${a.field} = ${redact(a.value)} (seen on ${a.seen_on_hosts}/${a.of_hosts_with_field})`));
      out.push("");
    }else if(sec==="ports"){
      out.push("## Ports","");
      ((SNAP&&SNAP.results)||[]).filter(r=>r.data&&r.data.firewall_posture!==undefined)
        .forEach(r=>{ const d=r.data;
          out.push(`- ${redact(d.host)} (${redact(d.address)}): ${d.open_count} open, `+
                   `${d.closed_count} closed, ${d.filtered_count} filtered — ${d.firewall_posture}`); });
      out.push("");
    }else if(sec==="assets"){
      const d=await get("inventory");
      out.push("## Assets","");
      ["hosts","ips","services","emails"].forEach(k=>{
        if(d&&(d[k]||[]).length) out.push(`- **${k}** (${d[k].length}): ${
          d[k].slice(0,40).map(redact).join(", ")}`);
      });
      out.push("");
    }else if(sec==="csp"){
      const d=await get("cspassets");
      out.push("## CSP assets","");
      if(d&&d.csp_present){
        out.push(`- new hosts not otherwise found: ${
          (Array.isArray(d.new_hosts_not_otherwise_found)?d.new_hosts_not_otherwise_found:[])
            .map(redact).join(", ")||"none"}`);
      }else out.push("(no CSP published)");
      out.push("");
    }else if(sec==="attribution"){
      const d=await get("attribution");
      out.push("## Attribution","");
      (d&&d.estates||[]).forEach(e=>out.push(
        `- estate of ${e.size} (confidence ${e.confidence}): ${e.members.map(redact).join(", ")}`));
      out.push("");
    }else if(sec==="opsec"){
      const d=await get("opsec");
      out.push("## OPSEC","", d?`${d.third_party_count} third parties saw this target — ${d.exposure}`:"(none)","");
    }else if(sec==="evidence"){
      out.push("## Raw evidence","");
      ((SNAP&&SNAP.results)||[]).slice(0,60).forEach(r=>{
        const flat={}; flatten(r.data,"",flat);
        out.push(`### ${r.module}`);
        Object.entries(flat).slice(0,40).forEach(([k,v])=>out.push(`- ${k}: ${redact(v)}`));
        out.push("");
      });
    }
  }
  if(REDACT) out.push("", "_Values in this report were redacted before export._");
  return out.join("\n");
}

let SQ="";
VIEWS.search = ()=>{
  if(!JOB) return set(needScan("Search"));
  set(head(t("search.t","Search results"),
    t("search.w","Free-text across every field every module returned. Across 553 "+
      "modules this is usually the fastest way to an answer.")) + `
    <div class="filters">
      <input type="text" id="sq" placeholder="redis · module:tls · field:server · host:api"
             value="${esc(SQ)}" style="flex:1;max-width:520px">
      <button class="btn primary" id="sgo">Search</button>
    </div>
    <div class="note" style="margin:0 0 12px;border:0;padding:0">Operators:
      <code>module:</code> <code>field:</code> <code>host:</code> narrow the
      results; anything else is full-text.</div>
    <div id="sout"></div>`);
  const run=async ()=>{
    SQ=$("sq").value.trim();
    if(!SQ) return $("sout").innerHTML="";
    // #41 operators: module: / field: / host: narrow client-side; the rest is
    // sent to the backend's full-text search
    const ops={}; const free=[];
    SQ.split(/\s+/).forEach(tok=>{
      const m=tok.match(/^(module|field|host|severity):(.+)$/i);
      if(m) ops[m[1].toLowerCase()]=m[2].toLowerCase(); else free.push(tok);
    });
    $("sout").innerHTML=loading();
    try{
      const q=free.join(" ") || Object.values(ops)[0] || "";
      const d=await api(`/api/job/${encodeURIComponent(JOB)}/search?q=${encodeURIComponent(q)}`);
      let hits=d.matches||d.results||d.hits||[];
      if(ops.module) hits=hits.filter(h=>(h.module||"").toLowerCase().includes(ops.module));
      if(ops.field)  hits=hits.filter(h=>(h.field||h.key||"").toLowerCase().includes(ops.field));
      if(ops.host)   hits=hits.filter(h=>(h.target||"").toLowerCase().includes(ops.host));
      $("sout").innerHTML = hits.length?`
        <div style="color:var(--muted);margin-bottom:9px">${d.count!=null?d.count:hits.length} match(es)${
          d.by_module?" across "+Object.keys(d.by_module).length+" module(s)":""}</div>
        <div class="tblwrap"><table><thead><tr><th>Module</th><th>Field</th><th>Value</th></tr></thead>
        <tbody>${hits.map(h=>`<tr>
          <td class="num">${esc(h.module||"")}</td>
          <td class="num" style="color:var(--ink-2)">${esc(h.field||h.key||"")}</td>
          <td class="wrap">${esc(h.snippet||h.value||h.detail||h.match||"")}</td></tr>`).join("")}
        </tbody></table></div>`
        : `<div class="banner info">Nothing in this scan matches ${esc(SQ)}.</div>`;
    }catch(e){ $("sout").innerHTML=errBox(e.message); }
  };
  $("sgo").onclick=run;
  $("sq").addEventListener("keydown", e=>{ if(e.key==="Enter") run(); });
  $("sout").addEventListener("click", e=>{               // #47 jump to the module
    const a=e.target.closest("[data-jump]"); if(!a) return;
    e.preventDefault(); expanded.add(a.dataset.jump); go("live");
    setTimeout(()=>{ const el=document.querySelector(`[data-card="${a.dataset.jump}"]`);
      if(el) el.scrollIntoView({block:"center"}); }, 400);
  });
  $("sq").focus();
  if(SQ) run();
};

/* ==========================================================================
   #46 — several scans open at once.

   Comparing two hosts, or the same host before and after a change, otherwise
   means loading one, writing things down, and loading the other. The tabs hold
   the snapshots this session already has, so switching between them is free
   and costs no request.
   ========================================================================== */
let ACTIVETAB=null;
const TABS=[];                       // [{id, target, snap, live}] — newest last
/* `live` distinguishes a running/finished job (the per-job endpoints resolve
   it) from a scan restored out of storage (they do not — its id is a scan id,
   and JOB must stay null so the analysis views fall back to the snapshot). */
function openTab(id, target, opts={}){
  if(!id) return;
  const live = opts.live!==false;
  const at=TABS.findIndex(t=>t.id===id);
  const snap = opts.snap || ((SNAP && (live ? JOB===id : true)) ? SNAP
                             : (at>=0 ? TABS[at].snap : null));
  if(at>=0) TABS[at]={id, target:target||TABS[at].target, snap, live};
  else TABS.push({id, target:target||id, snap, live});
  while(TABS.length>6) TABS.shift();    // six is more than anyone compares
  ACTIVETAB=id;
  drawTabs();
}
function drawTabs(){
  const el=$("jobtabs"); if(!el) return;
  el.hidden = TABS.length<2;            // one tab is not a tab bar
  // clear it as well as hide it: leaving the old buttons in the DOM leaves
  // their click handlers live on a tab that no longer exists
  if(el.hidden){ el.innerHTML=""; return; }
  el.innerHTML = TABS.map(t=>`
    <button class="tab" data-tab="${esc(t.id)}" ${ACTIVETAB===t.id?'data-on="1"':""}
      title="${esc(t.id)}">
      <span>${esc(t.target)}</span>
      <span class="x" data-close="${esc(t.id)}" title="close">×</span>
    </button>`).join("") +
    (TABS.length>1?`<button class="tab" id="tabdiff" title="compare the two most recent"
      >⇄ compare</button>`:"");
  el.querySelectorAll("[data-tab]").forEach(b=> b.onclick=e=>{
    if(e.target.dataset.close) return;
    switchTab(b.dataset.tab);
  });
  el.querySelectorAll("[data-close]").forEach(x=> x.onclick=e=>{
    e.stopPropagation();
    const i=TABS.findIndex(t=>t.id===x.dataset.close);
    if(i>=0) TABS.splice(i,1);
    // closing the tab you are reading has to leave you somewhere real
    if(ACTIVETAB===x.dataset.close && TABS.length) switchTab(TABS[TABS.length-1].id);
    else drawTabs();
  });
  const d=$("tabdiff"); if(d) d.onclick=()=>compareTabs();
}
function switchTab(id){
  const tab=TABS.find(t=>t.id===id); if(!tab) return;
  ACTIVETAB=id;
  JOB = tab.live ? tab.id : null;
  Object.keys(CACHE).forEach(k=>delete CACHE[k]);
  if(tab.snap){ SNAP=tab.snap; drawTabs(); writeUrl(); render(); return; }
  api(`/api/job/${encodeURIComponent(id)}`).then(s=>{
    tab.snap=s; SNAP=s; drawTabs(); writeUrl(); render();
  }).catch(e=>toast("That scan is no longer in memory: "+e.message));
}
/* A side-by-side of the two most recent tabs. Deliberately module-level and
   not finding-level: the API already has a findings diff for two *stored*
   scans, and duplicating it here would be a second answer to one question. */
function compareTabs(){
  const [a,b]=TABS.slice(-2);
  if(!a||!b||!a.snap||!b.snap) return toast("Both tabs need results first.");
  const fields=snap=>{
    const out=new Set();
    (snap.results||[]).forEach(r=>{
      const flat={}; flatten(r.data, "", flat);
      Object.keys(flat).forEach(k=>out.add(r.module+"."+k+"="+flat[k]));
    });
    return out;
  };
  const fa=fields(a.snap), fb=fields(b.snap);
  const only=(x,y)=>[...x].filter(v=>!y.has(v));
  const inA=only(fa,fb), inB=only(fb,fa);
  const sevOf=snap=>((snap.risk&&snap.risk.findings)||[]).length;
  modal(`${a.target} vs ${b.target}`, `
    <div class="grid g2" style="margin-bottom:12px">
      ${stat(esc(a.target), sevOf(a.snap), `${(a.snap.results||[]).length} modules`)}
      ${stat(esc(b.target), sevOf(b.snap), `${(b.snap.results||[]).length} modules`)}
    </div>
    <div class="grid g2">
      <div><div class="eyebrow">only in ${esc(a.target)} (${inA.length})</div>
        <div style="max-height:210px;overflow:auto;font-family:var(--mono);font-size:11px">
          ${inA.slice(0,120).map(v=>`<div>${esc(v.slice(0,110))}</div>`).join("")
            || "<div style='color:var(--muted)'>nothing</div>"}</div></div>
      <div><div class="eyebrow">only in ${esc(b.target)} (${inB.length})</div>
        <div style="max-height:210px;overflow:auto;font-family:var(--mono);font-size:11px">
          ${inB.slice(0,120).map(v=>`<div>${esc(v.slice(0,110))}</div>`).join("")
            || "<div style='color:var(--muted)'>nothing</div>"}</div></div>
    </div>
    <div class="note">Values either scan observed. A value missing from one side
      may mean the module did not run there, not that the thing is absent —
      check the module counts above before reading anything into it.</div>`,
    ()=>{}, "Close");
}

/* Open a scan out of storage into every analysis view. Shared by History and
   by the cross-scan search, which both mean the same thing by "open this run". */
async function loadStoredScan(id){
  try{
    const raw=await api(`/api/scan/${encodeURIComponent(id)}`);
    JOB=null; SNAP={target:raw.target, status:"done",
      total:(raw.results||[]).length, done:(raw.results||[]).length,
      results:raw.results||[], risk:raw.risk||{}};
    Object.keys(CACHE).forEach(k=>delete CACHE[k]);
    // JOB stays null on purpose: a stored-scan id is not a job id, and the
    // per-job endpoints would 404 on it. The tab carries the snapshot itself.
    openTab(id, raw.target, {live:false, snap:SNAP});
    notify(`Loaded the stored scan of ${raw.target}`);
    toast("Loaded — the analysis views now read this scan. Live-only views "+
          "(fix order, anomalies) need a running job and will say so.");
    go("live");
  }catch(e){ toast(e.message); }
}

    </div>
    <div class="note">STARTTLS is used unless the port is 465 (implicit TLS).
      The password is stored server-side with your API keys and is never sent
      back to this page. A report is a list of your own weaknesses — it is
      exactly the message you do not want travelling in clear.</div>`,
    async vals=>{

}

/* ---------- Search all scans (#40) ----------
   Per-scan search answers "what did this run find". This answers the question
   you actually have six months later: "where have I *ever* seen this?" — which
   no single scan can answer, because the answer is in a run you closed in March. */
let LIBQ="", LIBTGT="";
VIEWS.library = ()=>{
  set(head(t("lib.t","Search all scans"),
    t("lib.w","Free-text search across every scan in the store, not just the one on "+
    "screen. Each hit says which run it came from, so you can open that run and "+

    `<button class="btn sm" id="libgo">Search</button>`) + `
    <div class="filters">
      <input type="text" id="libq" style="flex:1;min-width:220px"
        placeholder="an IP, a header, a CVE, a hostname…" value="${esc(LIBQ)}">
      <input type="text" id="libtgt" style="max-width:220px"
        placeholder="limit to one target (optional)" value="${esc(LIBTGT)}">
    </div>
    <div id="libout"></div>`);
  const run=async ()=>{
    LIBQ=$("libq").value.trim(); LIBTGT=$("libtgt").value.trim();

      <p>An empty query would return every value of every scan, which is not a search.</p></div>`;
    $("libout").innerHTML=loading();
    try{
      const d=await api(`/api/search-all?q=${encodeURIComponent(LIBQ)}`+
        (LIBTGT?`&target=${encodeURIComponent(LIBTGT)}`:""));
      if(VIEW!=="library") return;
      $("libout").innerHTML = `
        <div class="grid g4" style="margin:13px 0">
          ${stat("Matches", d.count||0, d.count>(d.matches||[]).length
            ? `showing the first ${(d.matches||[]).length}` : "")}
          ${stat("Scans searched", d.scanned||0, `of ${d.stored_scans||0} stored`)}
          ${stat("Targets hit", Object.keys(d.by_target||{}).length)}
        </div>
        ${(d.matches||[]).length?`<div class="tblwrap"><table>
          <thead><tr><th>Target</th><th>When</th><th>Module</th><th>Field</th>
            <th>Match</th><th></th></tr></thead>
          <tbody>${d.matches.map(m=>`<tr>
            <td class="num">${esc(m.target)}</td>
            <td class="num" style="color:var(--muted)">${esc((m.ts||"").slice(0,16).replace("T"," "))}</td>
            <td class="num">${esc(m.module)}</td>
            <td class="num" style="color:var(--ink-2)">${esc(m.field)}</td>
            <td class="wrap">${esc(m.snippet)}</td>
            <td><button class="btn sm" data-open="${esc(m.scan_id)}">Open run</button></td>
          </tr>`).join("")}</tbody></table></div>`
          :`<div class="empty"><h2>No finding value matches</h2>
            <p>No saved scan has <b>${esc(LIBQ)}</b> in any field a module returned.
            This searches what you kept, not the internet.</p></div>`}
        ${(d.target_matches||[]).length?`<div class="banner info">
          <b>${d.target_matches.length} scan(s) of a matching target</b> —
          you have scanned this, the string just does not appear in any finding.
          ${d.target_matches.slice(0,6).map(m=>
            `<button class="btn sm" data-open="${esc(m.scan_id)}">${esc(m.target)}
             · ${esc((m.ts||"").slice(0,10))}</button>`).join(" ")}</div>`:""}`;
      document.querySelectorAll("[data-open]").forEach(b=> b.onclick=()=>{
        loadStoredScan(b.dataset.open);
      });
    }catch(e){ if(VIEW==="library") $("libout").innerHTML=errBox(e.message); }
  };
  $("libgo").onclick=run;
  $("libq").onkeydown=e=>{ if(e.key==="Enter") run(); };
  $("libq").focus();
  if(LIBQ) run();
};

/** A sparkline per numeric series. A trend you cannot see is a table. */
function trendChart(tr){
  const series = tr.series || tr.history || tr.points || [];
  if(!Array.isArray(series) || series.length<2)
    return `<div class="banner info">${esc(tr.note||"Not enough history yet — two scans of this target are needed to draw a trend.")}</div>`;
  const keys=[...new Set(series.flatMap(p=>Object.keys(p)))]
    .filter(k=>series.every(p=>typeof p[k]==="number"));
  if(!keys.length) return `<div class="banner info">No numeric series to chart.</div>`;
  return keys.slice(0,4).map(k=>{
    const vals=series.map(p=>p[k]||0), max=Math.max(...vals,1), W=320, H=52;
    const pts=vals.map((v,i)=>`${(i/(vals.length-1))*W},${H-(v/max)*(H-6)-3}`).join(" ");
    const last=vals[vals.length-1], first=vals[0];
    const dir = last>first ? "▲" : last<first ? "▼" : "=";
    return `<div style="margin-top:11px">
      <div class="eyebrow">${esc(k)} — ${first} → ${last} ${dir}</div>
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
      </svg></div>`;
  }).join("");
}

function opt(id, dflt){ const el=$(id); return el ? el.value : dflt; }
function chk(id){ const el=$(id); return el ? el.checked : false; }

let QUEUE=[], QI=0;
async function startScan(){
  const target=$("target").value.trim();
  if(!target){ $("target").focus(); return; }
  const extra=(opt("o-batch","")||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  QUEUE=[target, ...extra]; QI=0;
  await scopeCheck(target);            // #69 — warn before spending the scan
  return runQueued();
}
async function runQueued(){
  if(QI>=QUEUE.length){ QUEUE=[]; return; }
  const target=QUEUE[QI];
  const label = QUEUE.length>1 ? ` (${QI+1}/${QUEUE.length})` : "";
  await startOne(target, label);
}
async function startOne(target, label){
  // when the Scan view is not mounted, fall back to the command-bar profile
  const sel = $("pickbody") ? currentSelection()
            : {mode:"profile", value:$("quickProfile").value};
  const options={
    timeout:+opt("o-timeout",15), parallel:+opt("o-parallel",4),
    threads:+opt("o-threads",10), rate:+opt("o-rate",0),
    rate_per_host:+opt("o-rate-host",0),
    cache:chk("o-cache"), insecure:chk("o-insecure"), tor:chk("o-tor"),
    deep:chk("o-deep"),
    user_agent:(opt("o-ua","")||"").trim() || undefined,
    alert_webhook:(opt("o-alert","")||"").trim(),
    ports:(opt("o-ports","")||"").trim(),
    scan_retries:+opt("o-scan-retries",1),
    scan_rate:+opt("o-scan-rate",0),
    scan_all_addresses:chk("o-scan-all-addr"),
  };
  let res;
  try{ res=await api("/api/scan",{method:"POST",
        body:JSON.stringify({target, selection:sel, options})}); }
  catch(e){ QUEUE=[]; set(errBox("Scan rejected: "+e.message)+$("view").innerHTML); return; }
  BATCH_LABEL = label||"";
  rememberTarget(target);
  JOB=res.job_id; SNAP=null; expanded=new Set();
  Object.keys(CACHE).forEach(k=>delete CACHE[k]);
  openTab(JOB, target);
  setScanning(true);
  go("live");
  tick();
  if(!openStream()) poll=setInterval(tick,1000);
}

let BATCH_LABEL="", OPSEC_TIMER=null;
async function stopScan(){
  if(!JOB) return;

  $("runbtn").disabled=true; $("statustxt").textContent="Stopping…";
  try{ await api(`/api/job/${JOB}/cancel`,{method:"POST"}); }catch(e){}

/* #1 SSE — push instead of poll, with an honest fallback: a dashboard that
   goes blank because a proxy ate the stream is worse than a chatty one.
   #6 in-flight de-duplication lives in api() below. */
let ES=null;
function openStream(){
  closeStream();
  if(!JOB || typeof EventSource==="undefined") return false;
  try{
    const url=`/api/job/${encodeURIComponent(JOB)}/stream`+
      (TOKEN?`?token=${encodeURIComponent(TOKEN)}`:"");
    ES=new EventSource(url);
    ES.addEventListener("job", e=>{
      try{ applySnapshot(JSON.parse(e.data)); }catch(err){}
    });
    ES.onerror=()=>{ closeStream(); if(scanning && !poll) poll=setInterval(tick,1000); };
    return true;
  }catch(e){ return false; }
}
function closeStream(){ if(ES){ try{ ES.close(); }catch(e){} ES=null; } }

async function tick(){
  if(!JOB) return;
  let s;
  try{ s=await api(`/api/job/${encodeURIComponent(JOB)}`); }
  catch(e){
    if(++MISSES>=5){ stopPoll(); $("statustxt").textContent="Backend unreachable";
      $("dot").className="dot err"; }
    return;
  }
  MISSES=0; applySnapshot(s);
}

/** One place that turns a job snapshot into UI, whether it arrived by stream
 *  or by poll. #8: while you are reading a finished view we do not yank it
 *  away — a pill offers the new data instead. */
function applySnapshot(s){
  const wasRunning = SNAP && SNAP.status==="running";
  SNAP=s;
  const done=s.done||0, total=s.total||1;
  $("prog").style.width = Math.round(100*done/total)+"%";
  $("b-live").textContent = done;
  $("b-find").textContent = (s.risk&&s.risk.findings||[]).length;
  updateThroughput(s);
  if(VIEW==="live") renderStream(s);
  if(s.status!=="running"){
    stopPoll(); closeStream(); setScanning(false);
    const map={done:["done","Complete"],cancelled:["stop","Stopped"],error:["err","Error"]};
    const [cls,txt]=map[s.status]||["done","Done"];
    $("dot").className="dot "+cls;
    $("statustxt").textContent=`${t("cmd."+(s.status==="done"?"complete":
      s.status==="cancelled"?"stopped":"error"), txt)} — ${s.target}${BATCH_LABEL}`;
    $("prog").style.width="0%";
    refreshBadges();
    // #71 — a finished scan is worth keeping. When the backend is gone the
    // console can still show you the last one instead of an empty page.
    IDB.put("lastjob", {id:JOB, snap:s, at:Date.now()});
    openTab(JOB, s.target);
    Object.keys(CACHE).forEach(k=>{ if(k.startsWith(JOB+":")) delete CACHE[k]; });
    if(VIEW==="live") render();
    else if(wasRunning) newDataPill();
    if(s.status==="done" && QUEUE.length && ++QI < QUEUE.length){
      setTimeout(runQueued, 600);
    }else{ QUEUE=[]; }
  }
}
function newDataPill(){
  toast("Scan finished — this view has newer data",
        {label:"Refresh", run:()=>reload()});
}

/* #10 throughput meter — modules/second and the adaptive-rate state, so a
   scan that has quietly stalled looks different from one that is just slow. */
let THRU=[];
function updateThroughput(s){
  const now=performance.now();
  THRU.push([now, s.done||0]);
  THRU=THRU.filter(([ts])=>now-ts<20000);
  const el=$("thru"); if(!el) return;
  if(THRU.length<2) return el.textContent="";
  const [t0,d0]=THRU[0], [t1,d1]=THRU[THRU.length-1];
  const rate=((d1-d0)/((t1-t0)/1000))||0;
  el.textContent = s.status==="running"
    ? `${rate.toFixed(1)} modules/s` : "";
}

function stopPoll(){ if(poll){ clearInterval(poll); poll=null; } }

  }
}

/** Badge counts come from the analysis endpoints, so the rail tells you where
 *  to look without having to open every view. */
async function refreshBadges(){
  if(!JOB) return;
  const jobs = [
    ["fixorder","b-fix", d=>d.act_now_count||0, true],
    ["anomalies","b-anom", d=>d.anomaly_count||0, false],
  ];
  for(const [sub,id,pick,alert] of jobs){
    try{
      const d=await api(`/api/job/${encodeURIComponent(JOB)}/${sub}`);
      CACHE[JOB+":"+sub]=d;
      const n=pick(d); const el=$(id); if(!el) continue;
      el.textContent=n;
      el.classList.toggle("alert", alert && n>0);
    }catch(e){}
  }
  try{
    const v=await api("/api/verdicts");
    $("b-verd").textContent=v.count||0;
  }catch(e){}
}

/* #77 notification centre — background events you would otherwise miss. */
const EVENTS=[];
function notify(text, kind){
  EVENTS.unshift({text, kind:kind||"info", ts:new Date().toLocaleTimeString()});
  EVENTS.splice(40);
  const b=$("b-events"); if(b){ b.textContent=EVENTS.length; b.classList.toggle("alert", kind==="err"); }
}
function eventCentre(){
  modal("Notifications", EVENTS.length
    ? `<div class="tblwrap"><table><tbody>${EVENTS.map(e=>`<tr>
        <td class="num" style="color:var(--muted)">${esc(e.ts)}</td>
        <td class="wrap"><span class="pill ${e.kind==="err"?"critical":"muted"}">${esc(e.kind)}</span>
          ${esc(e.text)}</td></tr>`).join("")}</tbody></table></div>`
    : `<p style="color:var(--muted)">Nothing yet.</p>`, ()=>{}, "Close");
}

/* #78 — a token that stopped working should say so, not fail silently. */
function authProblem(msg){
  notify("Authentication failed — the dashboard token may have changed", "err");
  set(`<div class="banner err"><b>Not authorised.</b> ${esc(msg)}<br>
    The console was opened with a token that the backend no longer accepts.</div>
    <div class="field" style="max-width:420px"><label>Dashboard token</label>
      <input type="password" id="newtok" placeholder="paste the token"></div>
    <button class="btn primary" id="tokgo">Reconnect</button>`);
  $("tokgo").onclick=()=>{
    const t=$("newtok").value.trim(); if(!t) return;
    location.search="?token="+encodeURIComponent(t);
  };
}

/* #63 / #65 — control a scan while it runs. */
async function pauseResume(){
  if(!JOB) return;
  try{
    await api(`/api/job/${encodeURIComponent(JOB)}/cancel`,{method:"POST"});
    notify("Scan stopped from the console");
    toast("Stopped — Ghost Eye scans are resumable by re-running the remaining "+
          "modules, which the queue does for a batch");
  }catch(e){ toast(e.message); }
}

/* #68 — live OPSEC meter while the scan is running. */
async function opsecMeter(){
  if(!JOB) return;
  try{
    const d=await api(`/api/job/${encodeURIComponent(JOB)}/opsec`);
    const el=$("opsecmeter"); if(!el) return;
    el.textContent = d.third_party_count
      ? `${d.third_party_count} third parties have seen this target`
      : "";
  }catch(e){}
}

/* #69 — check the scope before spending a scan on a refusal. */
async function scopeCheck(target){
  try{
    const sc=await api("/api/scope");
    if(sc.empty) return true;
    const host=String(target).replace(/^\w+:\/\//,"").split("/")[0].split(":")[0];
    const ok=(sc.entries||[]).some(e=>{
      const x=e.trim().toLowerCase();
      if(x.startsWith("*.")) return host.endsWith(x.slice(1));
      return host===x || host.endsWith("."+x) || x.includes("/");
    });
    if(!ok){
      notify(`${target} looks out of scope`, "err");
      toast(`${target} is not in the scope allow-list — the backend will refuse it`);
    }
    return ok;
  }catch(e){ return true; }
}

/* #30 timeline scrubber — a slider over the intelligence timeline. */
function timelineScrubber(rows){
  if(!(rows||[]).length) return "";
  return `<div class="card" style="margin-bottom:13px"><h3>Timeline
      <span class="tag">${rows.length} events</span></h3>
    <input type="range" id="tl-range" min="1" max="${rows.length}" value="${rows.length}"
      style="width:100%;accent-color:var(--accent)">
    <div id="tl-body"></div></div>`;
}

/* #35 — the diff between two scans drawn as a graph overlay. */
function diffOverlay(cmp){
  const add=(cmp.added||[]).length, rem=(cmp.removed||[]).length,
        chg=(cmp.changed||[]).length, total=Math.max(1, add+rem+chg);
  return `<svg viewBox="0 0 100 12" preserveAspectRatio="none"
      style="width:100%;height:14px;margin:9px 0">
    <rect x="0" y="0" width="${100*add/total}" height="12" fill="var(--crit)" opacity=".8"><title>added ${add}</title></rect>
    <rect x="${100*add/total}" y="0" width="${100*rem/total}" height="12" fill="var(--ok)" opacity=".8"><title>removed ${rem}</title></rect>
    <rect x="${100*(add+rem)/total}" y="0" width="${100*chg/total}" height="12" fill="var(--med)" opacity=".8"><title>changed ${chg}</title></rect>
  </svg>`;
}

/* #48 — every run of a target as a ribbon. */
function scanRibbon(scans, target){
  const mine=(scans||[]).filter(s=>s.target===target).slice(0,40).reverse();
  if(mine.length<2) return "";
  const col=r=>({CRITICAL:"var(--crit)",HIGH:"var(--high)",MEDIUM:"var(--med)"}[r]||"var(--ok)");
  return `<div class="card" style="margin-bottom:13px"><h3>Runs of ${esc(target)}</h3>
    <div style="display:flex;gap:3px;align-items:flex-end;height:44px">
      ${mine.map(s=>`<div title="${esc(s.ts)} — ${esc(s.risk||"")}"
        style="flex:1;min-width:4px;height:${20+Math.min(24,(s.score||0)/3)}px;
               background:${col(s.risk)};border-radius:2px"></div>`).join("")}
    </div>
    <div class="note">Height is the risk score; colour is the level. Hover for the date.</div></div>`;
}

/* #51 — scheduled runs as a week grid. */
function scheduleCalendar(rows){
  if(!(rows||[]).length) return "";
  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  return `<div class="card" style="margin-bottom:13px"><h3>This week</h3>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">
      ${days.map(d=>`<div><div class="eyebrow" style="text-align:center">${d}</div>
        <div style="border:1px solid var(--line);border-radius:8px;min-height:64px;padding:5px">
          ${rows.map(r=>`<div class="pill muted" style="display:block;margin-bottom:3px;
            font-size:9.5px;overflow:hidden;text-overflow:ellipsis">${esc(r.target)}</div>`).join("")}
        </div></div>`).join("")}
    </div>
    <div class="note">Interval schedules run continuously; this shows which
      targets are covered, not an exact clock time.</div></div>`;
}

/* #79 — a module can ship its own renderer. Registered by id; the console
   falls back to the generic key/value view for everything else. */
const PANELS={};
function registerPanel(moduleId, fn){ PANELS[moduleId]=fn; }
window.ghostEyeRegisterPanel = registerPanel;

/* #73 — roving tabindex so the rail is one Tab stop with arrow navigation. */
function wireRailKeys(){
  const items=[...document.querySelectorAll(".navitem")];
  items.forEach((b,i)=> b.tabIndex = i===0 ? 0 : -1);
  $("nav").addEventListener("keydown", e=>{
    const list=[...document.querySelectorAll(".navitem")];
    const at=list.indexOf(document.activeElement);
    if(at<0) return;
    let next=at;
    if(e.key==="ArrowDown") next=Math.min(at+1, list.length-1);
    else if(e.key==="ArrowUp") next=Math.max(at-1, 0);
    else if(e.key==="Home") next=0;
    else if(e.key==="End") next=list.length-1;
    else return;
    e.preventDefault();
    list[at].tabIndex=-1; list[next].tabIndex=0; list[next].focus();
  });
}

/* ==========================================================================
   Boot
   ========================================================================== */
function applyChrome(){
  const th=(()=>{ try{ return localStorage.getItem("ge_theme")||"dark"; }catch(e){ return "dark"; } })();
  const den=(()=>{ try{ return localStorage.getItem("ge_density")||"comfortable"; }catch(e){ return "comfortable"; } })();
  document.documentElement.dataset.theme=th;
  document.documentElement.dataset.density=den;
}
$("themetoggle").onclick=()=>{
  const order=["dark","light","contrast"];
  const cur=document.documentElement.dataset.theme||"dark";
  const next=order[(order.indexOf(cur)+1)%order.length];
  try{ localStorage.setItem("ge_theme", next); }catch(e){}
  applyChrome(); toast("Theme: "+next);
};
$("denstoggle").onclick=()=>{
  const next=(document.documentElement.dataset.density==="compact")?"comfortable":"compact";
  try{ localStorage.setItem("ge_density", next); }catch(e){}
  applyChrome(); toast("Density: "+next);
};

(async function boot(){
  applyLang(); applyChrome();
  if("serviceWorker" in navigator){
    try{ navigator.serviceWorker.register("/sw.js"); }catch(e){}
  }
  try{
    META=await api("/api/meta");
    META.byId={}; META.modules.forEach(m=>{ META.byId[m.id]=m; });
    IDB.put("meta", META);
    $("ver").textContent="v"+META.version;
  }catch(e){
    if(/401|403|token|auth/i.test(e.message)) return authProblem(e.message);
    // #71 offline: fall back to whatever the last session cached
    const cached=await IDB.get("meta");
    if(cached){
      META=cached; notify("Backend unreachable — showing the last cached state", "err");
      // #71 — the findings themselves, not just the module catalogue. A cached
      // page that can only tell you which modules exist is not an offline mode.
      const last=await IDB.get("lastjob");
      if(last && last.snap){
        JOB=last.id; SNAP=last.snap; OFFLINE=true;
        applyLang();
        offlineBanner(SNAP.target, last.at);
        go("live");
        return;
      }
      set(`<div class="banner warn">The backend is unreachable. This is the
        console's cached view of the last session; scans cannot be started.</div>`);
    }else{
      set(`<div class="banner err">Cannot reach the backend: ${esc(e.message)}.
        Is <code>ghost_eye_web.py</code> running${TOKEN?"":", and does it need a ?token="}?</div>`);
    }
    return;
  }
  wireRailKeys(); applyPins(); drawRecent();
  $("bell").onclick=eventCentre;
  // #43 — the deep link is the whole point of writing job and workspace into
  // the URL. Reading it back at boot is what makes a shared link land on the
  // view it names instead of dropping the recipient on Scan.
  const link=readUrl();
  let start=link.view || (location.hash||"").replace("#","");
  let job=link.job;
  // a language toggle reloads the page; sessionStorage carries the scan across
  try{
    const j=sessionStorage.getItem("ge_job");
    if(j){ job=j; sessionStorage.removeItem("ge_job"); }
    const v=sessionStorage.getItem("ge_view");
    if(v){ start=v; sessionStorage.removeItem("ge_view"); }
  }catch(e){}
  if(job){
    JOB=job;
    try{
      SNAP=await api(`/api/job/${encodeURIComponent(JOB)}`);
      refreshBadges();
      // a link to a scan that is still running should keep updating, not
      // freeze on whichever frame happened to be current when it was opened
      if(SNAP && SNAP.status==="running"){
        setScanning(true);
        if(!openStream()) poll=setInterval(tick,1000);
      }
    }catch(e){
      JOB=null;
      notify("That scan is no longer in memory — open it from History.", "err");
    }
  }
  go(VIEWS[start] ? start : "scan");
  try{ const v=await api("/api/verdicts"); $("b-verd").textContent=v.count||0; }catch(e){}
})();
</script>
