<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Eye — reconnaissance console</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0d13">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ==========================================================================
   Ghost Eye console.
   Layout: a fixed rail of workspaces, a persistent command bar, one content
   region. Every backend capability is reachable from the rail — the previous
   console exposed 11 of 30 endpoints, which is why most of the product was
   invisible.
   ========================================================================== */
:root{
  --bg:#0a0d13; --surface:#10141d; --surface-2:#161b26; --surface-3:#1d2432;
  --line:#232b3a; --line-2:#303a4d; --line-3:#42506a;
  --ink:#e9eef7; --ink-2:#a8b4c8; --muted:#7b8699; --faint:#525c6f;
  --accent:#f0b545; --accent-2:#e09a2e; --accent-ink:#1a1204;
  --cyan:#5cc9d8; --violet:#a68bf0; --blue:#6aa9ff; --green:#41c48a;
  --crit:#ff5d63; --high:#ff934a; --med:#ecc94b; --low:#5fa8d3; --ok:#41c48a;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  --r:10px; --r-sm:7px; --r-lg:14px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -18px rgba(0,0,0,.75);
  --ring:0 0 0 3px rgba(240,181,69,.16);
  --rail:224px; --bar:58px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:13.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.hidden{display:none !important}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;
  border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:15px 16px;
  border-bottom:1px solid var(--line);flex-shrink:0}
.brand svg{width:30px;height:30px;flex:0 0 30px;
  filter:drop-shadow(0 0 8px rgba(240,181,69,.25))}
.brand b{font-family:var(--mono);font-size:13px;letter-spacing:.15em;
  text-transform:uppercase;display:block}
.brand .sub{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--faint)}
.nav{flex:1;overflow-y:auto;padding:10px 8px;min-height:0}
.navgrp{margin:14px 0 5px;padding:0 9px}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:var(--r-sm);color:var(--ink-2);cursor:pointer;width:100%;
  text-align:left;transition:background .12s,color .12s;position:relative}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem[aria-current="true"]{background:var(--surface-3);color:var(--ink);
  box-shadow:inset 2px 0 0 var(--accent)}
.navitem .ico{width:17px;text-align:center;flex:0 0 17px;opacity:.85;font-size:13px}
.navitem .badge{margin-left:auto;font-family:var(--mono);font-size:10px;
  background:var(--surface-3);border:1px solid var(--line-2);color:var(--muted);
  padding:1px 6px;border-radius:20px;min-width:20px;text-align:center}
.navitem .badge.alert{background:rgba(255,93,99,.14);border-color:rgba(255,93,99,.4);
  color:var(--crit)}
.railfoot{border-top:1px solid var(--line);padding:9px 12px;flex-shrink:0;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.cmdbar{height:var(--bar);flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);
  position:relative;z-index:20}
.tgt{flex:1;max-width:460px;position:relative;display:flex;align-items:center}
.tgt input{width:100%;background:var(--bg);border:1px solid var(--line-2);
  border-radius:var(--r-sm);padding:8px 11px 8px 30px;font-size:13px;outline:none}
.tgt input:focus{border-color:var(--accent);box-shadow:var(--ring)}
.tgt .at{position:absolute;left:11px;color:var(--faint);font-family:var(--mono);
  pointer-events:none}
.sel{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:8px 9px;outline:none;max-width:230px}
.sel:focus{border-color:var(--accent);box-shadow:var(--ring)}
.btn{background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink);
  padding:8px 14px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;
  transition:border-color .12s,background .12s;white-space:nowrap}
.btn:hover{border-color:var(--line-3);background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{background:rgba(255,93,99,.13);border-color:rgba(255,93,99,.45);color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:11px;font-weight:500}
.status{margin-left:auto;display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 7px}
.dot.run{background:var(--accent);animation:pulse 1.4s infinite}
.dot.done{background:var(--ok)} .dot.err{background:var(--crit)} .dot.stop{background:var(--high)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,181,69,.5)}
  70%{box-shadow:0 0 0 6px rgba(240,181,69,0)}100%{box-shadow:0 0 0 0 rgba(240,181,69,0)}}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);
  width:0;transition:width .3s ease;box-shadow:0 0 8px rgba(240,181,69,.5)}

.view{flex:1;overflow-y:auto;padding:20px 22px 60px;min-height:0}
/* #46 — open scans. Hidden entirely at one tab: a tab bar with one tab is
   chrome that teaches you nothing. */
.tabs{display:flex;gap:5px;padding:6px 22px 0;flex-shrink:0;overflow-x:auto;
  border-bottom:1px solid var(--line);background:var(--surface)}
.tabs[hidden]{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  background:transparent;border:1px solid var(--line);border-bottom:none;
  border-radius:7px 7px 0 0;color:var(--muted);font:inherit;font-size:11.5px;
  padding:6px 11px;cursor:pointer;position:relative;top:1px}
.tab:hover{color:var(--ink)}
.tab[data-on="1"]{background:var(--bg);color:var(--ink);border-color:var(--line-2);
  border-bottom:1px solid var(--bg)}
.tab .x{color:var(--faint);font-size:13px;line-height:1}
.tab .x:hover{color:var(--crit)}
.viewhead{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.viewhead h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.viewhead .why{color:var(--muted);font-size:12.5px;margin:0 0 18px;max-width:70ch;
  line-height:1.6}
.actions{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:12.5px;font-weight:650;letter-spacing:.01em;
  display:flex;align-items:center;gap:8px}
.card h3 .tag{font-family:var(--mono);font-size:9.5px;color:var(--muted);
  border:1px solid var(--line-2);padding:1px 6px;border-radius:20px;font-weight:500}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:26px;font-weight:650;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .n{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.stat.crit .v{color:var(--crit)} .stat.high .v{color:var(--high)}
.stat.med .v{color:var(--med)} .stat.ok .v{color:var(--ok)}
.stat.accent .v{color:var(--accent)}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;
  border-bottom:1px solid var(--line);background:var(--surface-2);
  position:sticky;top:0;white-space:nowrap;z-index:2}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.wrap{max-width:520px;word-break:break-word}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line-2);
  color:var(--ink-2);white-space:nowrap;font-weight:600;letter-spacing:.03em}
.pill.critical{background:rgba(255,93,99,.13);border-color:rgba(255,93,99,.42);color:var(--crit)}
.pill.high{background:rgba(255,147,74,.12);border-color:rgba(255,147,74,.4);color:var(--high)}
.pill.medium{background:rgba(236,201,75,.12);border-color:rgba(236,201,75,.38);color:var(--med)}
.pill.low{background:rgba(95,168,211,.12);border-color:rgba(95,168,211,.35);color:var(--low)}
.pill.ok,.pill.confirmed{background:rgba(65,196,138,.12);border-color:rgba(65,196,138,.38);color:var(--ok)}
.pill.muted{color:var(--muted)}
.pill.accent{background:rgba(240,181,69,.12);border-color:rgba(240,181,69,.4);color:var(--accent)}
.pill.cyan{background:rgba(92,201,216,.12);border-color:rgba(92,201,216,.36);color:var(--cyan)}

/* ---------- forms ---------- */
.field{margin-bottom:11px}
.field label{display:block;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--line-2);
  border-radius:var(--r-sm);padding:7px 9px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);box-shadow:var(--ring)}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
.check{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:12.5px}
.check input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}

/* ---------- module picker ---------- */
.picker{display:grid;grid-template-columns:150px 1fr;gap:0;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;background:var(--surface);height:330px}
.pickmode{border-right:1px solid var(--line);background:var(--surface-2);padding:7px}
.pickmode button{display:block;width:100%;text-align:left;padding:7px 10px;
  border-radius:var(--r-sm);color:var(--ink-2);font-size:12.5px}
.pickmode button[aria-current="true"]{background:var(--surface-3);color:var(--ink)}
.pickbody{padding:12px;overflow-y:auto;min-width:0}
.modlist{max-height:210px;overflow-y:auto;border:1px solid var(--line);
  border-radius:var(--r-sm);padding:5px;background:var(--bg)}
.catgrp{margin-bottom:5px}
.cathead{display:flex;align-items:center;gap:8px;padding:5px 7px;cursor:pointer;
  border-radius:var(--r-sm);background:var(--surface-2)}
.cathead .ct{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.mod{display:flex;align-items:center;gap:8px;padding:4px 7px 4px 22px;cursor:pointer;
  border-radius:var(--r-sm);font-size:12px}
.mod:hover{background:var(--surface-2)}
.mod .mid{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}

/* ---------- results stream ---------- */
.res{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;
  background:var(--surface);overflow:hidden}
.reshead{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;
  user-select:none}
.reshead:hover{background:var(--surface-2)}
.reshead .nm{font-weight:600;font-size:12.5px}
.reshead .cat{font-family:var(--mono);font-size:10px;color:var(--muted)}
.reshead .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.resbody{border-top:1px solid var(--line);padding:11px 13px;background:var(--bg);
  font-family:var(--mono);font-size:11.5px}
.kv{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:3px 14px;
  align-items:start}
.kv .k{color:var(--muted);word-break:break-word}
.kv .v{color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.kv .v.sev-critical{color:var(--crit)} .kv .v.sev-high{color:var(--high)}
.kv .v.sev-medium{color:var(--med)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.32;margin-bottom:14px}
.empty h2{color:var(--ink-2);font-size:15px;font-weight:600;margin:0 0 6px}
.empty p{margin:0 auto;max-width:46ch;font-size:12.5px;line-height:1.65}
.banner{border-radius:var(--r);padding:11px 14px;margin-bottom:14px;font-size:12.5px;
  border:1px solid var(--line-2);background:var(--surface-2);line-height:1.6}
.banner.warn{border-color:rgba(255,147,74,.45);background:rgba(255,147,74,.09)}
.banner.err{border-color:rgba(255,93,99,.45);background:rgba(255,93,99,.09)}
.banner.info{border-color:rgba(92,201,216,.35);background:rgba(92,201,216,.07)}
.note{color:var(--muted);font-size:11.5px;line-height:1.65;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line-2);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.bar-h{height:5px;background:var(--surface-3);border-radius:20px;overflow:hidden;margin-top:6px}
.bar-h i{display:block;height:100%;background:var(--accent);border-radius:20px}
code{font-family:var(--mono);font-size:11.5px;background:var(--surface-3);
  padding:1px 5px;border-radius:4px;color:var(--ink-2)}

/* ---------- modal ---------- */
.scrim{display:none;position:fixed;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(3px);
  z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:var(--shadow);width:min(560px,100%);max-height:85vh;overflow-y:auto;padding:20px}
.modal h2{margin:0 0 4px;font-size:15px}

/* ---------- RTL ---------- */
[dir="rtl"] .rail{border-right:none;border-left:1px solid var(--line)}
[dir="rtl"] .navitem[aria-current="true"]{box-shadow:inset -2px 0 0 var(--accent)}
[dir="rtl"] .navitem .badge,[dir="rtl"] .actions,[dir="rtl"] .status{margin-left:0;margin-right:auto}
[dir="rtl"] .tgt input{padding:8px 30px 8px 11px}
[dir="rtl"] .tgt .at{left:auto;right:11px}
[dir="rtl"] th,[dir="rtl"] td{text-align:right}
[dir="rtl"] .pickmode{border-right:none;border-left:1px solid var(--line)}
[dir="rtl"] .pickmode button{text-align:right}
[dir="rtl"] .mod{padding:4px 22px 4px 7px}
[dir="rtl"] .mod .mid,[dir="rtl"] .cathead .ct,[dir="rtl"] .reshead .sp{
  margin-left:0;margin-right:auto}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:80;
    transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .scrim:not(.hidden){display:block;z-index:70}
  [dir="rtl"] .rail{inset:0 0 0 auto;transform:translateX(100%)}
  [dir="rtl"] .rail.open{transform:none}
  .menubtn{display:inline-flex !important}
  .view{padding:15px 14px 60px}
  .picker{grid-template-columns:1fr;height:auto}
  /* #72 — a seven-column table on a phone is unreadable; each row becomes a
     card with its header as a label. */
  .tblwrap table,.tblwrap thead,.tblwrap tbody,.tblwrap th,.tblwrap td,.tblwrap tr{display:block}
  .tblwrap thead{position:absolute;left:-9999px}
  .tblwrap tr{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;
    padding:6px 8px;background:var(--surface)}
  .tblwrap td{border:none;padding:3px 0;display:flex;gap:9px}
  .tblwrap td::before{content:attr(data-label);color:var(--muted);
    font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
    letter-spacing:.12em;min-width:76px;flex:0 0 76px}
  .pickmode{display:flex;gap:5px;overflow-x:auto;border-right:none;
    border-bottom:1px solid var(--line)}
  .pickmode button{width:auto;white-space:nowrap}
}
.menubtn{display:none}
/* #38 themes — light and high-contrast redefine the tokens, nothing else */
:root[data-theme="light"]{
  --bg:#f6f7fa; --surface:#fff; --surface-2:#eef1f6; --surface-3:#e3e8f0;
  --line:#d7dde7; --line-2:#c3ccda; --line-3:#a6b2c4;
  --ink:#141922; --ink-2:#3c4657; --muted:#5f6b7d; --faint:#8b95a5;
  --accent:#a86b00; --accent-2:#8d5900; --accent-ink:#fff;
  --crit:#c62630; --high:#b45309; --med:#8a6d1a; --low:#1f6f9c; --ok:#0f7a4d;
  --shadow:0 1px 2px rgba(16,24,40,.08), 0 10px 28px -16px rgba(16,24,40,.28);
}
:root[data-theme="contrast"]{
  --bg:#000; --surface:#0a0a0a; --surface-2:#141414; --surface-3:#1f1f1f;
  --line:#4a4a4a; --line-2:#6a6a6a; --line-3:#8a8a8a;
  --ink:#fff; --ink-2:#eaeaea; --muted:#c8c8c8; --faint:#a0a0a0;
  --accent:#ffd24a; --accent-ink:#000;
  --crit:#ff6b70; --high:#ffab5e; --med:#ffe066; --low:#7cc7f0; --ok:#5fe0a3;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){ color-scheme:light }
}
/* #75 density */
:root[data-density="compact"]{ --r:8px; --r-sm:6px }
:root[data-density="compact"] body{ font-size:12.5px }
:root[data-density="compact"] td{ padding:5px 9px }
:root[data-density="compact"] th{ padding:7px 9px }
:root[data-density="compact"] .card{ padding:11px 12px }
:root[data-density="compact"] .stat{ padding:9px 11px }
:root[data-density="compact"] .stat .v{ font-size:21px }
:root[data-density="compact"] .navitem{ padding:5px 10px }
/* #74 respect reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important;
    animation-iteration-count:1 !important; transition-duration:.001ms !important }
}
.skip{position:absolute;left:-9999px;top:8px;z-index:120;background:var(--accent);
  color:var(--accent-ink);padding:9px 15px;border-radius:var(--r-sm);font-weight:700}
.skip:focus{left:12px;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* filter bar */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.filters input[type=text]{background:var(--bg);border:1px solid var(--line-2);
  border-radius:var(--r-sm);padding:7px 10px;min-width:220px;outline:none}
.filters input:focus{border-color:var(--accent);box-shadow:var(--ring)}
.fchip{font-family:var(--mono);font-size:11px;padding:5px 11px;border-radius:20px;
  border:1px solid var(--line-2);color:var(--muted);cursor:pointer;user-select:none;
  background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.fchip[data-on="1"]{border-color:var(--accent);color:var(--accent);box-shadow:var(--ring)}
.fchip .n{font-weight:700;color:var(--ink)}
/* screenshot gallery */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px}
.shots figure{margin:0;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:var(--surface)}
.shots img{width:100%;display:block;background:#000}
.shots figcaption{padding:7px 10px;font-family:var(--mono);font-size:10.5px;
  color:var(--muted);word-break:break-all}
/* sparkline */
.spark{width:100%;height:64px;display:block}

"use strict";
/* ==========================================================================
   API layer
   ========================================================================== */
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const $ = id => document.getElementById(id);
function hdrs(){ const h={"Content-Type":"application/json"}; if(TOKEN) h["X-Ghost-Token"]=TOKEN; return h; }
const INFLIGHT=new Map();          // #6 — one request per identical GET
async function api(path, opts={}){
  const key=(opts.method||"GET")+" "+path;
  if(!opts.method && INFLIGHT.has(key)) return INFLIGHT.get(key);
  const run=(async ()=>{
    const r = await fetch(path, {...opts, headers:{...hdrs(), ...(opts.headers||{})}});
    const body = await r.json().catch(()=>({error:r.statusText}));
    if(!r.ok) throw new Error(body.error || r.statusText);
    return body;
  })();
  if(!opts.method){
    INFLIGHT.set(key, run);
    // .catch() before .finally() on purpose. `run.finally(...)` returns a NEW
    // promise that also rejects when `run` does, and nothing awaits that one —
    // so every failed GET raised an unhandled rejection even though the caller
    // handled the error properly. Visible as a red console entry on any 500,
    // any timeout, and every single request once the backend is unreachable.
    run.catch(()=>{}).finally(()=>INFLIGHT.delete(key));
  }
  return run;
}

/* #7 — a small IndexedDB cache so a reload does not refetch a finished scan,
   and #71 so the console still shows the last scan when the backend is down. */
const IDB=(()=>{
  let db=null;
  const open=()=> new Promise(res=>{
    if(db) return res(db);
    if(!("indexedDB" in window)) return res(null);
    const rq=indexedDB.open("ghosteye",1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore("kv");
    rq.onsuccess=()=>{ db=rq.result; res(db); };
    rq.onerror=()=>res(null);
  });
  return {
    async put(k,v){ const d=await open(); if(!d) return;
      try{ d.transaction("kv","readwrite").objectStore("kv").put(v,k); }catch(e){} },
    async get(k){ const d=await open(); if(!d) return null;
      return new Promise(res=>{
        try{ const rq=d.transaction("kv").objectStore("kv").get(k);
          rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null);
        }catch(e){ res(null); } });
    }
  };
})();
if(TOKEN) $("osintlink").href = "/osint?token=" + encodeURIComponent(TOKEN);

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,

  });

  try{
    localStorage.setItem("ge_lang", LANG);

    if(JOB) sessionStorage.setItem("ge_job", JOB);
    sessionStorage.setItem("ge_view", VIEW);
  }catch(e){}

/* ==========================================================================
   Iris mark
   ========================================================================== */
(function iris(){
  const svg=$("iris"); if(!svg) return;
  const NS="http://www.w3.org/2000/svg";
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);
    for(const k in a) e.setAttribute(k,a[k]); return e;};
  svg.appendChild(mk("circle",{cx:50,cy:50,r:46,fill:"none",
    stroke:"#2a3448","stroke-width":2}));
  for(let i=0;i<28;i++){
    const a=i/28*Math.PI*2, r1=30, r2=42;
    svg.appendChild(mk("line",{x1:50+Math.cos(a)*r1,y1:50+Math.sin(a)*r1,
      x2:50+Math.cos(a)*r2,y2:50+Math.sin(a)*r2,stroke:"#f0b545",
      "stroke-width":1.6,opacity:.32+.5*Math.abs(Math.sin(a*2))}));
  }
  svg.appendChild(mk("circle",{cx:50,cy:50,r:15,fill:"#0a0d13",
    stroke:"#f0b545","stroke-width":2.5}));
  svg.appendChild(mk("circle",{cx:50,cy:50,r:6,fill:"#f0b545"}));
})();

/* ==========================================================================
   Deep links (#43) — the workspace AND its filter state live in the URL, so a
   view you are looking at can be sent to someone else and they land on it.
   ========================================================================== */
function writeUrl(){
  const p=new URLSearchParams();
  if(JOB) p.set("job", JOB);
  if(VIEW!=="scan") p.set("w", VIEW);
  if(FFILTER.q) p.set("q", FFILTER.q);
  if(FFILTER.sev.size) p.set("sev", [...FFILTER.sev].join(","));
  if(TOKEN) p.set("token", TOKEN);
  const url = location.pathname + (p.toString()?"?"+p:"") ;
  try{ history.replaceState(null,"",url); }catch(e){}
}
function readUrl(){
  const p=new URLSearchParams(location.search);
  if(p.get("q")) FFILTER.q=p.get("q");
  if(p.get("sev")) FFILTER.sev=new Set(p.get("sev").split(",").filter(Boolean));
  return {job:p.get("job"), view:p.get("w")};
}
window.addEventListener("popstate", ()=>{
  const st=readUrl();
  if(st.view && VIEWS[st.view]) go(st.view);
});

/* ==========================================================================
   Command palette (#39) — 27 workspaces is more than a rail can make fast.
   Ctrl/Cmd-K jumps to a workspace, a module, or an action.
   ========================================================================== */
function palette(){
  const items=[];
  document.querySelectorAll(".navitem").forEach(b=>{
    // the label is the [data-i18n] span, NOT innerText: the first line of a
    // rail button is its icon glyph, so matching on that finds nothing.
    const span=b.querySelector("[data-i18n]");
    items.push({kind:"go",
      label:(span?span.textContent:b.dataset.view).trim(),
      hint:"workspace · "+b.dataset.view,
      run:()=>go(b.dataset.view)});
  });
  items.push(
    {kind:"act", label:"Run scan", hint:"action", run:()=>startScan()},
    {kind:"act", label:"Stop scan", hint:"action", run:()=>stopScan()},
    {kind:"act", label:"Refresh this view", hint:"action", run:()=>reload()},
    {kind:"act", label:"Toggle language / החלף שפה", hint:"action",
     run:()=>$("langtoggle").click()},
    {kind:"act", label:"Copy a link to this view", hint:"action", run:()=>{
      writeUrl();
      navigator.clipboard && navigator.clipboard.writeText(location.href);
      toast("Link copied");}});
  (META?META.modules:[]).forEach(m=>items.push({
    kind:"mod", label:m.name, hint:m.id+" · "+m.category,
    run:()=>{ PICK="modules"; go("scan");
      setTimeout(()=>{ const c=document.querySelector(`.modchk[value="${m.id}"]`);
        if(c){ c.checked=true; c.scrollIntoView({block:"center"}); updateSelCount(); }},60); }}));

  let sel=0, shown=items;
  const wrap=document.createElement("div");
  wrap.className="scrim"; wrap.style.cssText="display:flex;align-items:flex-start;padding-top:12vh";
  wrap.innerHTML=`<div class="modal" style="width:min(620px,100%);padding:0"
      role="dialog" aria-modal="true" aria-label="Command palette">
    <input id="palq" placeholder="Jump to a workspace, module or action…"
      style="width:100%;background:var(--bg);border:none;border-bottom:1px solid var(--line);
             padding:15px 17px;font-size:14px;outline:none;font-family:var(--sans)">
    <div id="pallist" style="max-height:46vh;overflow-y:auto"></div></div>`;
  document.body.appendChild(wrap);
  const draw=()=>{
    const q=$("palq").value.toLowerCase();
    shown=items.filter(i=>!q || (i.label+" "+i.hint).toLowerCase().includes(q)).slice(0,40);
    if(sel>=shown.length) sel=Math.max(0,shown.length-1);
    $("pallist").innerHTML=shown.map((i,n)=>`
      <div class="palrow" data-n="${n}" style="display:flex;gap:11px;align-items:center;
        padding:9px 17px;cursor:pointer;${n===sel?"background:var(--surface-3)":""}">
        <span class="pill ${i.kind==="go"?"cyan":i.kind==="act"?"accent":"muted"}"
          style="min-width:74px;justify-content:center">${i.kind==="go"?"go":i.kind==="act"?"do":"module"}</span>
        <span>${esc(i.label)}</span>
        <span style="margin-left:auto;color:var(--faint);font-family:var(--mono);font-size:10.5px">${esc(i.hint)}</span>
      </div>`).join("") || `<div style="padding:17px;color:var(--muted)">No match.</div>`;
  };
  const close=()=>{ wrap.remove(); document.removeEventListener("keydown", key, true); };
  const key=e=>{
    if(e.key==="Escape"){ e.preventDefault(); return close(); }
    if(e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(sel+1, shown.length-1); draw(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(sel-1,0); draw(); }
    if(e.key==="Enter" && shown[sel]){ e.preventDefault(); const r=shown[sel].run; close(); r(); }
  };
  document.addEventListener("keydown", key, true);
  wrap.addEventListener("click", e=>{
    if(e.target===wrap) return close();
    const row=e.target.closest(".palrow");
    if(row){ const r=shown[+row.dataset.n].run; close(); r(); }
  });
  $("palq").oninput=draw;
  draw(); $("palq").focus();
}

/* The backend being unreachable is a *condition*, not an event: a toast that
   fades after two seconds leaves you reading stale findings with no idea they
   are stale. This stays until the page is reloaded against a live backend. */
function offlineBanner(target, at){
  const when = at ? new Date(at).toLocaleString() : "the last session";
  const el=document.createElement("div");
  el.id="offlinebar";
  el.style.cssText=`position:sticky;top:0;z-index:40;padding:8px 22px;
    background:var(--surface-3);border-bottom:1px solid var(--line-2);
    font-size:12px;color:var(--ink-2)`;
  el.innerHTML=`<b>Backend unreachable</b> — showing the cached scan of
    <b>${esc(target||"?")}</b> from ${esc(when)}. Nothing here is live, no scan
    can be started, and any view the backend computes will say it needs one.`;
  const main=document.querySelector(".main");
  if(main) main.insertBefore(el, main.firstChild);
}

/* Anything that rejects with nobody listening would otherwise vanish into the
   devtools console, which is exactly where a user will not look. */
window.addEventListener("unhandledrejection", e=>{
  const why=(e.reason && (e.reason.message||e.reason)) || "unknown";
  if(OFFLINE && /fetch|network|Load failed/i.test(String(why))){
    e.preventDefault();          // expected while offline; the banner says so
    return;
  }
  console.warn("unhandled rejection:", why);
});

/* toast for transient confirmations (#14, #39) */
function toast(text, action){
  const el=document.createElement("div");
  el.style.cssText=`position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--surface-3);border:1px solid var(--line-2);border-radius:var(--r);
    padding:11px 16px;z-index:100;box-shadow:var(--shadow);display:flex;gap:12px;
    align-items:center;font-size:12.5px`;
  el.innerHTML=`<span>${esc(text)}</span>`;
  if(action){
    const b=document.createElement("button");
    b.className="btn sm"; b.textContent=action.label;
    b.onclick=()=>{ el.remove(); action.run(); };
    el.appendChild(b);
  }
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), action?7000:2600);
}

/* A real modal. `prompt()` blocks the page, cannot be styled, cannot be
   cancelled meaningfully and looks like 1998 — not what "professional" means. */
function modal(title, bodyHtml, onOk, okLabel){
  const wrap=document.createElement("div");
  wrap.className="scrim"; wrap.style.display="flex";
  wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2><div id="mbody">${bodyHtml}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" data-m="cancel">Cancel</button>
      <button class="btn primary" data-m="ok">${esc(okLabel||"OK")}</button>
    </div></div>`;
  document.body.appendChild(wrap);
  const close=()=>{ wrap.remove(); document.removeEventListener("keydown", onKey); };
  const onKey=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKey);
  wrap.addEventListener("click", e=>{
    if(e.target===wrap || e.target.dataset.m==="cancel") return close();
    if(e.target.dataset.m==="ok"){
      const vals={};
      wrap.querySelectorAll("[data-field]").forEach(el=>vals[el.dataset.field]=el.value);
      close(); onOk(vals);
    }
  });
  const first=wrap.querySelector("[data-field]"); if(first) first.focus();
  return close;
}

function head(title, why, actions){

}

}
function loading(){ return `<div class="empty"><span class="spin"></span>
  <p style="margin-top:12px">${esc(t("w.working","Working…"))}</p></div>`; }
function errBox(msg){ return `<div class="banner err">${esc(msg)}</div>`; }
function noteBox(text){ return text?`<div class="note">${esc(text)}</div>`:""; }

/** Fetch a job sub-resource, render through `fn`, cache per job. */
async function jobView(sub, fn, opts={}){
  if(!JOB) return set(needScan(opts.what||sub));
  const key=JOB+":"+sub;
  const done = d => { set(fn(d)); if(opts.after) opts.after(); };
  if(CACHE[key] && !opts.fresh) return done(CACHE[key]);
  set(loading());
  try{
    CACHE[key] = await api(`/api/job/${encodeURIComponent(JOB)}/${sub}`);
    if(VIEW===opts.view) done(CACHE[key]);
  }catch(e){
    if(VIEW===opts.view) set(errBox(e.message));
  }
}

/* #66 — presets. A scan configuration you retype every time is a configuration
   you get wrong eventually. */
function loadPresets(){
  try{ return JSON.parse(localStorage.getItem("ge_presets")||"{}"); }catch(e){ return {}; }
}
function savePresets(o){ try{ localStorage.setItem("ge_presets", JSON.stringify(o)); }catch(e){} }
function drawPresets(){
  const sel=$("presetSel"); if(!sel) return;
  const names=Object.keys(loadPresets()).sort();
  sel.innerHTML = names.length ? names.map(n=>`<option>${esc(n)}</option>`).join("")
    : `<option value="">(none saved yet)</option>`;
}
function currentOptions(){
  const o={};
  ["o-timeout","o-parallel","o-threads","o-rate","o-rate-host","o-ua","o-alert",
   "o-ports","o-scan-retries","o-scan-rate"].forEach(id=>{ const e=$(id); if(e) o[id]=e.value; });
  ["o-cache","o-tor","o-insecure","o-deep","o-scan-all-addr","o-baseline-learn"]
    .forEach(id=>{ const e=$(id); if(e) o[id]=e.checked; });
  return o;
}
function applyPreset(pr){
  Object.entries(pr.options||{}).forEach(([id,v])=>{
    const e=$(id); if(!e) return;
    if(e.type==="checkbox") e.checked=!!v; else e.value=v;
  });
  const selq=pr.selection||{};
  PICK=selq.mode||"profile";
  drawPicker(Object.keys(META.profiles).sort(), Object.keys(META.categories).sort());
  setTimeout(()=>{
    if(PICK==="profile" && $("profileSel")) $("profileSel").value=selq.value;
    if(PICK==="category" && $("categorySel")) $("categorySel").value=selq.value;
    if(PICK==="modules") (selq.value||[]).forEach(id=>{
      const c=document.querySelector(`.modchk[value="${id}"]`); if(c) c.checked=true; });
    updateSelCount();
  }, 40);
}

/* #67 — dry run. What will this actually do, before it does it. */
function dryRun(){
  const sel=currentSelection();
  let ids=[];
  if(sel.mode==="all") ids=META.modules.map(m=>m.id);
  else if(sel.mode==="profile") ids=META.profiles[sel.value]||[];
  else if(sel.mode==="category") ids=META.categories[sel.value]||[];
  else ids=sel.value||[];
  const mods=ids.map(i=>META.byId?META.byId[i]:null).filter(Boolean);
  const cats={};
  mods.forEach(m=>{ cats[m.category]=(cats[m.category]||0)+1; });
  const parallel=Math.max(1,+opt("o-parallel",4));
  const timeout=+opt("o-timeout",15);
  // a module rarely burns its whole timeout; this is an upper bound, said so
  const worst=Math.round(ids.length/parallel*timeout);
  $("presetOut").innerHTML=`<b>${ids.length} module(s)</b> across
    ${Object.keys(cats).length} categor(ies): ${
      Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,8)
        .map(([c,n])=>`${esc(c)} ${n}`).join(" · ")}<br>
    Worst case ≈ <b>${Math.floor(worst/60)}m ${worst%60}s</b> at
    ${parallel} in parallel and a ${timeout}s timeout — an upper bound, since
    most modules answer long before their timeout. Nothing has been sent.`;
}

/* #67 (the honest half) — the dry run gives an upper bound from the timeout,
   which is nearly always far too pessimistic. This asks the backend what these
   modules have actually taken on this machine. With no history it says so
   rather than inventing a number. */
async function estimateRun(){
  const sel=currentSelection();
  const qs=new URLSearchParams({mode:sel.mode||"all"});
  if(sel.value) qs.set("value", Array.isArray(sel.value)?sel.value.join(","):sel.value);
  $("presetOut").innerHTML=`<span class="spin"></span>`;
  try{
    const d=await api("/api/estimate?"+qs.toString());
    const secs=d.estimated_seconds;
    $("presetOut").innerHTML = `
      <b>${d.modules} module(s)</b> —
      ${d.have_history && secs!=null
        ? `about <b>${secs<90?secs+"s":Math.floor(secs/60)+"m "+Math.round(secs%60)+"s"}</b>,
           measured from ${d.sampled_scans} recent scan(s) on this machine.
           Slowest single module ≈ ${(d.slowest_module_ms/1000).toFixed(1)}s.`
        : `<b>no timing history yet</b> — run one scan and this becomes a real number
           instead of the timeout-based upper bound above.`}
      <br>At most ~${d.requests_upper_bound} outbound requests.
      ${(d.paid_api_modules||[]).length
        ? `<br><b>${d.paid_api_modules.length} module(s) spend a third-party API quota</b>:
           ${d.paid_api_modules.map(esc).join(", ")}.`
        : `<br>None of these spend a paid API quota.`}
      <br>Nothing has been sent.`;
  }catch(e){ $("presetOut").innerHTML=errBox(e.message); }
}

/* #70 — which modules will silently skip themselves for want of a key. */
async function keyHealth(){
  $("presetOut").innerHTML=`<span class="spin"></span>`;
  try{
    const keys=(await api("/api/keys")).keys||[];
    const missing=keys.filter(k=>!k.set);
    $("presetOut").innerHTML = missing.length
      ? `<b>${missing.length} of ${keys.length} key(s) not configured</b> — modules
         needing them report "needs an API key" rather than fail:
         ${missing.map(k=>esc(k.label||k.name)).join(", ")}.
         Every core capability works without any of them.`
      : `All ${keys.length} known keys are configured.`;
  }catch(e){ $("presetOut").innerHTML=errBox(e.message); }
}

/* #80 — self-check: which endpoints answer, and how fast. */
async function selfCheck(){
  $("presetOut").innerHTML=`<span class="spin"></span> probing the backend…`;
  const probes=[["/api/meta","meta"],["/api/history","history"],
                ["/api/verdicts","verdicts"],["/api/baseline","baseline"],
                ["/api/schedules","schedules"],["/api/scope","scope"],
                ["/api/portfolio","portfolio"],["/api/alert-rules","alert rules"]];
  const rows=[];
  for(const [path,label] of probes){
    const t0=performance.now();
    try{ await api(path); rows.push([label, "ok", Math.round(performance.now()-t0)]); }
    catch(e){ rows.push([label, e.message.slice(0,40), Math.round(performance.now()-t0)]); }
  }
  $("presetOut").innerHTML=`<div class="tblwrap" style="margin-top:8px"><table>
    <thead><tr><th>Endpoint</th><th>Status</th><th>ms</th></tr></thead><tbody>
    ${rows.map(([l,st,ms])=>`<tr><td class="num">${esc(l)}</td>
      <td><span class="pill ${st==="ok"?"ok":"critical"}">${esc(st)}</span></td>
      <td class="num">${ms}</td></tr>`).join("")}</tbody></table></div>
    <div style="margin-top:7px">Console v${esc(META?META.version:"?")} ·
      ${esc(META?META.modules.length:"?")} modules registered.</div>`;
}

/* ---------- Live results ---------- */
VIEWS.live = ()=>{

  const s=SNAP, done=s.done||0, total=s.total||1;
  set(head(`${t("live.t","Live")} — ${esc(s.target)}`,
    t("live.w","Every module's raw output as it lands. Errors are expanded "+
      "automatically: a module that failed is a gap in coverage, not a blank line."),
    RE()) + `
    <div class="grid g4" style="margin-bottom:14px">
      ${stat("Progress", `${done}/${total}`, s.status)}
      ${stat("Findings", (s.risk&&s.risk.findings||[]).length, s.risk?s.risk.risk_level:"")}
      ${stat("Errors", (s.results||[]).filter(r=>r.status==="error").length)}
      ${stat("Elapsed", (s.elapsed!=null?s.elapsed+"s":"—"))}
    </div>
    <div class="bar-h" style="margin-bottom:14px"><i style="width:${Math.round(100*done/total)}%"></i></div>
    ${s.status!=="running"?timingChart(s)+waterfall(s.results||[]):""}
    <div id="stream"></div>`);
  renderStream(s, true);          // fresh mount: rebuild once, then patch
};
let STREAM_SEEN = new Map();          // module -> render signature
const STREAM_WINDOW = 120;           // #2 — only this many cards live in the DOM
function renderStream(s, force){
  const el=$("stream"); if(!el) return;
  const sev={};
  (s.risk&&s.risk.findings||[]).forEach(f=>{ sev[f.module+"::"+f.field]=f.severity; });
  if(force){ el.innerHTML=""; STREAM_SEEN=new Map(); }
  const all=s.results||[];
  // #2 virtualisation: 553 cards is more DOM than any browser enjoys, and you
  // are never reading the 400th. Keep a window of the most recent, plus every
  // errored module — a failure must never be scrolled out of existence.
  const errs=all.filter(r=>r.status==="error");
  const tail=all.slice(-STREAM_WINDOW);
  const show=[...new Map([...errs,...tail].map(r=>[r.module,r])).values()];
  const hidden=all.length-show.length;
  for(const r of show){
    const flat={}; flatten(r.data, "", flat);
    const sig = r.status + ":" + Object.keys(flat).length + ":" +
                (expanded.has(r.module)?1:0);
    if(STREAM_SEEN.get(r.module)===sig) continue;
    STREAM_SEEN.set(r.module, sig);
    const html = streamCard(r, flat, sev);
    const existing = el.querySelector(`[data-card="${cssEsc(r.module)}"]`);
    if(existing) existing.outerHTML = html;
    else el.insertAdjacentHTML("beforeend", html);
  }
  let note=el.querySelector("#streamnote");
  if(hidden>0){
    const txt=`${hidden} earlier module(s) not rendered — use Search, or the
      report export, to reach them. Errors are always shown.`;
    if(!note) el.insertAdjacentHTML("afterbegin",
      `<div class="banner info" id="streamnote">${txt}</div>`);
    else note.innerHTML=txt;
  }else if(note){ note.remove(); }
  if(!all.length && !el.innerHTML)
    el.innerHTML=`<div class="empty"><p>Waiting for the first module…</p></div>`;
}

/* #9 — which modules cost the scan its wall time. */
function timingChart(s){
  const rows=(s.results||[]).map(r=>({m:r.module, ms:+(r.elapsed_ms||r.elapsed||0)}))
    .filter(r=>r.ms>0).sort((a,b)=>b.ms-a.ms).slice(0,15);
  if(!rows.length) return "";
  const max=rows[0].ms||1;
  return `<div class="card" style="margin-bottom:13px"><h3>Where the time went</h3>
    ${rows.map(r=>`<div style="margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;font-size:11.5px">
        <span>${esc(r.m)}</span><span class="mono" style="color:var(--muted)">${
          (r.ms/1000).toFixed(1)}s</span></div>
      <div class="bar-h"><i style="width:${Math.round(100*r.ms/max)}%"></i></div>
    </div>`).join("")}</div>`;
}

function cssEsc(v){ return String(v).replace(/["\\]/g, "\\$&"); }
function streamCard(r, flat, sev){
  const isErr = r.status==="error";
  const open = expanded.has(r.module) || isErr;
  return `<div class="res" data-card="${esc(r.module)}">
      <div class="reshead" data-mod="${esc(r.module)}">
        <span class="nm">${esc(r.module)}</span>
        <span class="cat">${esc(r.target||"")}</span>
        <span class="sp">
          ${isErr?`<span class="pill critical">error</span>`:
            r.status==="empty"?`<span class="pill muted">empty</span>`:
            `<span class="pill ok">${Object.keys(flat).length} fields</span>`}
          <button class="btn sm" data-rerun="${esc(r.module)}"
            title="run only this module again">↻</button>
          <span class="mono" style="color:var(--faint)">${open?"▾":"▸"}</span>
        </span>
      </div>
      ${open?`<div class="resbody">${
        (PANELS[r.module] ? (()=>{ try{ return PANELS[r.module](r); }
                                   catch(e){ return ""; } })() : "") || (isErr
        ? `<span style="color:var(--crit)">${esc(r.error||"module errored")}</span>`
        : `<div class="kv">${Object.keys(flat).map(k=>{
            const sv = sev[r.module+"::"+k];
            return `<div class="k">${esc(k)}</div><div class="v${sv?" sev-"+sv:""}">${esc(flat[k])}</div>`;
          }).join("")}</div>`)}</div>`:""}
    </div>`;
}
/* one delegated handler instead of rebinding every row on every tick */
document.addEventListener("click", e=>{
  const rr=e.target.closest("[data-rerun]");
  if(rr){ e.stopPropagation(); return rerunModule(rr.dataset.rerun); }
  const h=e.target.closest(".reshead"); if(!h) return;
  const m=h.dataset.mod;
  expanded.has(m) ? expanded.delete(m) : expanded.add(m);
  if(SNAP) renderStream(SNAP);
});

/* #64 — re-run a single module. A module that errored on a transient timeout
   should not cost you all 553 again, and a module whose answer you doubt is
   worth one cheap second opinion. */
function rerunModule(name){
  const target=(SNAP&&SNAP.target)||$("target").value.trim();
  if(!target) return toast("No target to re-run against.");
  // the stream is keyed by module NAME; the API selects by module ID
  const meta=(META&&META.modules||[]).find(m=>m.name===name||m.id===name);
  if(!meta) return toast(`Cannot map "${name}" back to a module id.`);
  modal("Re-run one module", `<div class="note">Runs <b>${esc(meta.name)}</b>
    against <b>${esc(target)}</b> as a new job. Your current results stay open
    until the new job returns, so you can compare the two answers rather than
    losing the one you doubted.</div>`,
    async ()=>{
      try{
        const res=await api("/api/scan",{method:"POST", body:JSON.stringify({
          target, selection:{mode:"modules", value:[meta.id]}, options:{}})});
        JOB=res.job_id; SNAP=null; expanded=new Set([meta.name]);
        Object.keys(CACHE).forEach(k=>delete CACHE[k]);
        setScanning(true); go("live"); tick();
        if(!openStream()) poll=setInterval(tick,1000);
        toast(`Re-running ${meta.name}`);
      }catch(e){ toast("Could not re-run: "+e.message); }
    }, "Re-run");
}

function flatten(obj, prefix, out){
  if(obj===null||obj===undefined){ out[prefix||"value"]="—"; return; }
  if(Array.isArray(obj)){
    if(!obj.length){ out[prefix]="[]"; return; }
    if(obj.every(x=>typeof x!=="object")){ out[prefix]=obj.join("\n"); return; }
    obj.forEach((v,i)=>flatten(v, prefix?`${prefix}[${i}]`:`[${i}]`, out));
  }else if(typeof obj==="object"){
    const keys=Object.keys(obj);
    if(!keys.length){ out[prefix]="{}"; return; }
    keys.forEach(k=>flatten(obj[k], prefix?`${prefix}.${k}`:k, out));
  }else out[prefix]=String(obj);
}

/* #23 — a finding that names a CVE should land you on its row in Fix order. */
function jumpToFix(id){
  const d=CACHE[JOB+":verdicts"]||{};
  const f=(d.findings||[]).find(x=>x.id===id);
  const m=f && String(f.detail).match(/CVE-\d{4}-\d{4,7}/i);
  go("fixorder");
  if(m) setTimeout(()=>{
    const row=[...document.querySelectorAll("td")].find(td=>td.textContent.trim()===m[0].toUpperCase());
    if(row){ row.closest("tr").style.outline="2px solid var(--accent)";
      row.scrollIntoView({block:"center"}); }

  }, 900);
  else setTimeout(()=>toast("That finding names no CVE"), 600);

/* #16 — pivot. The same findings grouped by the thing you are thinking about. */
let GROUPBY="";
function groupRows(rows){
  if(!GROUPBY) return null;
  const key = f => GROUPBY==="host" ? (f.target||"—")
                 : GROUPBY==="module" ? f.module : f.severity;
  const out={};
  rows.forEach(f=>{ (out[key(f)] = out[key(f)]||[]).push(f); });
  return out;
}

/* #24 — the same fact found by six modules is one finding, not six. */
function collapseDuplicates(rows){
  const by={}, order=[];
  rows.forEach(f=>{
    const k=(f.field+"|"+String(f.detail)).toLowerCase();
    if(!by[k]){ by[k]={...f, _dupes:[f.module]}; order.push(k); }
    else if(!by[k]._dupes.includes(f.module)) by[k]._dupes.push(f.module);
  });
  return order.map(k=>by[k]);
}

/* #21 — copy one finding as Markdown or as a ticket body. */
function copyFinding(id, asTicket){
  const d=CACHE[JOB+":verdicts"]||{};
  const f=[...(d.findings||[]),...(d.suppressed||[])].find(x=>x.id===id);
  if(!f) return;
  const text = asTicket
    ? `${f.severity.toUpperCase()}: ${f.module} — ${f.field}\n\n`+
      `Target: ${f.target||""}\nDetail: ${f.detail}\n`+
      `Confidence: ${f.confidence||"?"} (${f.provenance_label||f.provenance||"?"})\n`+
      `Ghost Eye finding id: ${f.id}\n`
    : `- **${f.severity}** \`${f.module}\` — ${f.field}: ${f.detail} `+
      `_(${f.confidence||"?"})_`;
  if(navigator.clipboard) navigator.clipboard.writeText(text);
  toast(asTicket?"Copied as a ticket":"Copied as Markdown");
}

/** #11 — bulk verdicts. Twelve identical false positives should cost one action. */
function bulkRule(verdict){
  const ids=[...SELECTED];
  if(!ids.length) return;
  modal(`Rule ${ids.length} finding(s): ${verdict}`, `
    <div class="field"><label>Why — recorded on every one of them</label>
      <input type="text" data-field="reason" placeholder="same deliberate header everywhere"></div>
    <div class="note">Each ruling still locks onto that finding's own value, so a
      changed value comes back for judgement individually.</div>`,
    async vals=>{
      const undo=markLocally(ids, verdict);        // #5 paint first, confirm after
      let ok=0, failed=[];
      for(const id of ids){
        try{
          await api("/api/verdict",{method:"POST", body:JSON.stringify({
            id, verdict, reason:vals.reason||""})});
          ok++;
        }catch(e){ failed.push(id); }
      }
      LAST_RULED={ids, verdict};
      SELECTED.clear();
      if(!ok) undo();
      delete CACHE[JOB+":verdicts"]; reload();
      toast(failed.length
        ? `${ok} ruled ${verdict}, ${failed.length} refused by the backend`
        : `${ok} ruled ${verdict}`, ok?{label:"Undo", run:undoRuling}:null);
    }, "Record");
}

/** #13 — triage without the mouse. */
function triageKey(e){
  const rows=[...document.querySelectorAll("tr[data-fid]")];
  if(!rows.length) return;
  const cur=rows[Math.min(CURSOR, rows.length-1)];
  const id=cur && cur.dataset.fid;
  if(e.key==="j"){ e.preventDefault(); CURSOR=Math.min(CURSOR+1, rows.length-1); render(); }
  else if(e.key==="k"){ e.preventDefault(); CURSOR=Math.max(CURSOR-1,0); render(); }
  else if(e.key==="x" && id){ e.preventDefault();
    SELECTED.has(id)?SELECTED.delete(id):SELECTED.add(id); render(); }
  else if(e.key==="f" && id){ e.preventDefault(); rule(id,"false_positive"); }
  else if(e.key==="a" && id){ e.preventDefault(); rule(id,"accepted_risk"); }
  else if(e.key==="c" && id){ e.preventDefault(); rule(id,"confirmed"); }
  else if(e.key==="Enter" && id){ e.preventDefault(); evidence(id); }
}

/** #14 — undo. A ruling made by a keystroke needs a way back. */
async function undoRuling(){
  if(!LAST_RULED) return;
  for(const id of LAST_RULED.ids){
    try{ await api("/api/verdict",{method:"POST",
      body:JSON.stringify({id, verdict:"confirmed", reason:"undone"})}); }catch(e){}
  }
  LAST_RULED=null;
  delete CACHE[JOB+":verdicts"]; reload();
  toast("Ruling undone");
}

function rule(id, verdict){
  modal(`Rule: ${verdict}`, `
    <div class="field"><label>Why — recorded with the ruling</label>
      <input type="text" data-field="reason" placeholder="deliberate, behind SSO…"></div>
    <div class="row">
      <div class="field"><label>Scope</label>
        <select data-field="scope"><option value="">this host only</option>
          <option value="*">the whole estate</option></select></div>
      <div class="field"><label>Expires in (days)</label>
        <input type="number" data-field="ttl_days" value="180" min="1"></div>
    </div>
    <div class="note">A ruling locks onto the value you saw. When that value
      changes the finding returns for judgement, and the ruling stops
      suppressing once it expires.</div>`,
    async vals=>{
      // #5 optimistic: paint the ruling now and reconcile after. Waiting for a
      // round trip per finding makes triaging fifty of them feel broken; the
      // rollback below means a rejected write never leaves a lie on screen.
      const undo=markLocally([id], verdict);
      try{
        await api("/api/verdict",{method:"POST", body:JSON.stringify({
          id, verdict, reason:vals.reason||"",
          scope:vals.scope||"", ttl_days:+vals.ttl_days||180})});
        LAST_RULED={ids:[id], verdict};
        delete CACHE[JOB+":verdicts"]; reload();
        toast(`Ruled ${verdict}`, {label:"Undo", run:undoRuling});
      }catch(e){
        undo();
        render();
        toast("The verdict was NOT recorded: "+e.message);
      }
    }, "Record");
}
/* Apply a verdict to the cached payload so the table repaints immediately.
   Returns a function that puts it back exactly as it was — an optimistic UI
   without a rollback is just a UI that lies when the network fails. */
function markLocally(ids, verdict){
  const d=CACHE[JOB+":verdicts"];
  if(!d || !d.findings) return ()=>{};
  const before=[];
  ids.forEach(id=>{
    const f=d.findings.find(x=>x.id===id);
    if(f){ before.push([f, f.verdict]); f.verdict=verdict; }
  });
  render();
  return ()=>{ before.forEach(([f,v])=>{ f.verdict=v; }); };
}

async function unrule(id){
  try{
    await api("/api/verdict",{method:"POST",
      body:JSON.stringify({id, verdict:"confirmed", reason:"reinstated from console"})});
    delete CACHE[JOB+":verdicts"]; reload();
  }catch(e){ alert(e.message); }
}

/* ==========================================================================
   #3 — the entity-graph force layout, off the main thread.

   Measured before building it, because a Worker is not free: the findings
   filter costs 0.02ms per pass while a structured clone of the same array
   costs 0.08ms, so moving *that* to a worker would make the console four
   times slower. The layout is the opposite case — 180 steps of an O(n²)
   repulsion loop, ~950ms of blocked main thread at 400 nodes, in exchange for
   a position table small enough that the clone is free.

   The algorithm exists once. The worker is built from `layoutBody.toString()`,
   so the threaded and inline paths cannot drift apart, and the Blob URL is
   same-origin — the page still loads nothing from a remote host.
   ========================================================================== */
function layoutBody(nodes, links, W, H){
  const pos={}, vel={};
  nodes.forEach((n,i)=>{
    const a=i/Math.max(1,nodes.length)*Math.PI*2;
    const id=n.id||n.name;
    pos[id]=[W/2+Math.cos(a)*(W/3), H/2+Math.sin(a)*(H/3)];
    vel[id]=[0,0];
  });
  const K=Math.sqrt((W*H)/Math.max(1,nodes.length));
  for(let step=0; step<180; step++){
    const t=1-step/180;
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i].id||nodes[i].name;
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j].id||nodes[j].name;
        const dx=pos[a][0]-pos[b][0], dy=pos[a][1]-pos[b][1];
        const d2=dx*dx+dy*dy || 0.01;
        const rep=(K*K)/d2;
        const d=Math.sqrt(d2);
        vel[a][0]+=dx/d*rep; vel[a][1]+=dy/d*rep;
        vel[b][0]-=dx/d*rep; vel[b][1]-=dy/d*rep;
      }
    }
    for(const e of links){
      const a=e.source||e.from, b=e.target||e.to;
      if(!pos[a]||!pos[b]) continue;
      const dx=pos[a][0]-pos[b][0], dy=pos[a][1]-pos[b][1];
      const d=Math.sqrt(dx*dx+dy*dy)||0.01;
      const att=(d*d)/K;
      vel[a][0]-=dx/d*att; vel[a][1]-=dy/d*att;
      vel[b][0]+=dx/d*att; vel[b][1]+=dy/d*att;
    }
    for(const n of nodes){
      const id=n.id||n.name;
      const sp=Math.sqrt(vel[id][0]**2+vel[id][1]**2)||1;
      const cap=Math.min(sp, 22*t);
      pos[id][0]=Math.max(24, Math.min(W-24, pos[id][0]+vel[id][0]/sp*cap));
      pos[id][1]=Math.max(24, Math.min(H-24, pos[id][1]+vel[id][1]/sp*cap));
      vel[id][0]*=0.55; vel[id][1]*=0.55;
    }
  }
  return pos;
}

const KGCACHE={key:null, pos:null, pending:null};
/* The positions depend on the node and link sets — and on nothing else. A
   focus highlight, a text filter or a theme change must not re-run a second
   of physics to draw the same picture in a different colour. */
function kgKey(nodes, links){
  return nodes.length+"|"+links.length+"|"+
    nodes.map(n=>n.id||n.name).join(",")+"|"+
    links.map(e=>(e.source||e.from)+">"+(e.target||e.to)).join(",");
}
function kgLayout(nodes, links, W, H){
  if(!nodes.length) return {};
  const key=kgKey(nodes, links);
  if(KGCACHE.key===key && KGCACHE.pos) return KGCACHE.pos;
  // Small graphs settle faster than a worker takes to start; the threshold is
  // where the measurement put the crossover, not where it felt about right.
  if(nodes.length<=120 || typeof Worker==="undefined" || typeof Blob==="undefined"){
    KGCACHE.key=key; KGCACHE.pos=layoutBody(nodes, links, W, H);
    return KGCACHE.pos;
  }
  if(KGCACHE.pending===key) return null;      // already being computed
  KGCACHE.pending=key;
  try{
    const src=`self.layoutBody=${layoutBody.toString()};
      self.onmessage=e=>{ const d=e.data;
        self.postMessage(self.layoutBody(d.nodes, d.links, d.W, d.H)); };`;
    const url=URL.createObjectURL(new Blob([src], {type:"application/javascript"}));
    const w=new Worker(url);
    const finish=pos=>{
      URL.revokeObjectURL(url); w.terminate();
      KGCACHE.pending=null;
      KGCACHE.key=key; KGCACHE.pos=pos;
      if(VIEW==="intel") render();
    };
    w.onmessage=e=>finish(e.data);
    // a Worker that cannot start must not leave a spinner up for ever
    w.onerror=()=>finish(layoutBody(nodes, links, W, H));
    w.postMessage({nodes:nodes.map(n=>({id:n.id||n.name})),
                   links:links.map(e=>({source:e.source||e.from,
                                        target:e.target||e.to})), W, H});
    return null;                              // caller draws a placeholder
  }catch(err){
    KGCACHE.pending=null;
    KGCACHE.key=key; KGCACHE.pos=layoutBody(nodes, links, W, H);
    return KGCACHE.pos;
  }
}

/* Entity graph. State lives outside the renderer so filtering and focusing
   never re-fetch — a graph that reloads on every click is unusable. */
let KGSTATE={focus:null, hidden:new Set(), q:"", tx:0, ty:0, k:1};
function kgraph(kg){
  if(!kg || !(kg.nodes||[]).length) return "";
  const kinds=[...new Set(kg.nodes.map(n=>n.kind||n.type||"node"))].sort();
  return `<div class="card" style="margin-bottom:13px">
    <h3>Entity graph <span class="tag">${kg.nodes.length} nodes · ${(kg.edges||kg.links||[]).length} edges</span></h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
      ${kinds.map(k=>`<button class="pill kgfilter" data-kind="${esc(k)}"
        data-on="${KGSTATE.hidden.has(k)?"0":"1"}">${esc(k)}</button>`).join("")}
      <input type="text" id="kgq" placeholder="highlight…" value="${esc(KGSTATE.q||"")}"
        style="background:var(--bg);border:1px solid var(--line-2);border-radius:20px;
               padding:4px 11px;font-size:11px;width:130px;outline:none">
      <button class="btn sm" data-kgreset="1">Reset</button>
      <span style="color:var(--faint);font-size:10.5px;margin-left:auto">
        drag to pan · wheel to zoom · click a node for its neighbourhood</span>
    </div>
    <div id="kgbox">${kgSvg(kg)}</div></div>`;
}
function kgSvg(kg){
  const nodes=(kg.nodes||[]).filter(n=>!KGSTATE.hidden.has(n.kind||n.type||"node"))
                            .slice(0,400);
  const edges=(kg.edges||kg.links||[]);
  const ids=new Set(nodes.map(n=>n.id||n.name));
  const links=edges.filter(e=>ids.has(e.source||e.from)&&ids.has(e.target||e.to)).slice(0,900);
  const W=880, H=520;
  // Force layout: a ring tells you nothing about structure, which is the only
  // reason to draw a graph at all. The simulation itself is #3 material — see
  // kgLayout() below — and its result is cached, so highlighting a node or
  // typing in the graph filter reuses the positions instead of re-running a
  // second of physics to draw the same picture with a different colour.
  const pos = kgLayout(nodes, links, W, H);
  if(!pos) return `<div class="empty"><span class="spin"></span>
    <p style="margin-top:12px">Laying out ${nodes.length} nodes…</p>
    <p style="color:var(--muted);font-size:11.5px">Running off the main thread,
    so the console stays usable while it settles.</p></div>`;
  // neighbourhood of the focused node (#26)
  const near=new Set();
  if(KGSTATE.focus){
    near.add(KGSTATE.focus);
    for(const e of links){
      const a=e.source||e.from, b=e.target||e.to;
      if(a===KGSTATE.focus) near.add(b);
      if(b===KGSTATE.focus) near.add(a);
    }
  }
  const q=(KGSTATE.q||"").toLowerCase();
  const colour=k=>({domain:"#5cc9d8",ip:"#f0b545",host:"#6aa9ff",email:"#a68bf0",
    service:"#41c48a",tech:"#ecc94b",asn:"#ff934a"}[k]||"#7b8699");
  const deg={};
  links.forEach(e=>{ const a=e.source||e.from,b=e.target||e.to;
    deg[a]=(deg[a]||0)+1; deg[b]=(deg[b]||0)+1; });
  return `<svg id="kgsvg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;
      background:var(--bg);border:1px solid var(--line);border-radius:8px;cursor:grab;touch-action:none">
    <g id="kgpan" transform="translate(${KGSTATE.tx||0},${KGSTATE.ty||0}) scale(${KGSTATE.k||1})">
    ${links.map(e=>{const a=pos[e.source||e.from], b=pos[e.target||e.to];
      const on = !KGSTATE.focus || (near.has(e.source||e.from)&&near.has(e.target||e.to));
      return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"
        stroke="${on?"#39465e":"#1b2230"}" stroke-width="${on?1.2:0.6}"/>`;}).join("")}
    ${nodes.map(n=>{const id=n.id||n.name, pt=pos[id], k=n.kind||n.type||"node";
      const on = (!KGSTATE.focus || near.has(id)) && (!q || String(id).toLowerCase().includes(q));
      const r = 4 + Math.min(6, (deg[id]||0)*0.6) + (KGSTATE.focus===id?3:0);
      return `<g data-kgnode="${esc(id)}" style="cursor:pointer;opacity:${on?1:.16}">
        <circle cx="${pt[0]}" cy="${pt[1]}" r="${r}" fill="${colour(k)}"
          stroke="${KGSTATE.focus===id?"#fff":"none"}" stroke-width="1.4"/>
        ${(on && (r>6 || KGSTATE.focus===id || q))?`<text x="${pt[0]+r+3}" y="${pt[1]+3.5}"
          font-size="9.5" fill="#a8b4c8" font-family="ui-monospace,monospace"
          >${esc(String(id).slice(0,28))}</text>`:""}
      </g>`;}).join("")}
    </g></svg>`;
}

/* drag to pan, wheel to zoom — a graph you cannot move is a picture */
function wireGraph(){
  const svg=$("kgsvg"); if(!svg) return;
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  svg.addEventListener("pointerdown", e=>{
    if(e.target.closest("[data-kgnode]")) return;
    dragging=true; sx=e.clientX; sy=e.clientY;
    ox=KGSTATE.tx||0; oy=KGSTATE.ty||0;
    svg.style.cursor="grabbing"; svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e=>{
    if(!dragging) return;
    KGSTATE.tx=ox+(e.clientX-sx); KGSTATE.ty=oy+(e.clientY-sy);
    const g=$("kgpan"); if(g) g.setAttribute("transform",
      `translate(${KGSTATE.tx},${KGSTATE.ty}) scale(${KGSTATE.k||1})`);
  });
  const stop=e=>{ dragging=false; svg.style.cursor="grab"; };
  svg.addEventListener("pointerup", stop);
  svg.addEventListener("pointercancel", stop);
  svg.addEventListener("wheel", e=>{
    e.preventDefault();
    KGSTATE.k=Math.max(0.3, Math.min(4, (KGSTATE.k||1) * (e.deltaY<0?1.12:0.89)));
    const g=$("kgpan"); if(g) g.setAttribute("transform",
      `translate(${KGSTATE.tx||0},${KGSTATE.ty||0}) scale(${KGSTATE.k})`);
  }, {passive:false});
}

document.addEventListener("click", e=>{
  const node=e.target.closest("[data-kgnode]");
  if(node){
    const id=node.getAttribute("data-kgnode");
    KGSTATE.focus = KGSTATE.focus===id ? null : id;
    const d=CACHE[JOB+":intel"]; if(d){ $("kgbox").innerHTML=kgUpdate(d); wireGraph(); }
    return;
  }
  const f=e.target.closest(".kgfilter");
  if(f){
    const k=f.dataset.kind;
    KGSTATE.hidden.has(k) ? KGSTATE.hidden.delete(k) : KGSTATE.hidden.add(k);
    f.dataset.on = KGSTATE.hidden.has(k) ? "0" : "1";
    const d=CACHE[JOB+":intel"]; if(d){ $("kgbox").innerHTML=kgUpdate(d); wireGraph(); }
    return;
  }
  if(e.target.closest("[data-kgreset]")){
    KGSTATE={focus:null, hidden:new Set(), q:"", tx:0, ty:0, k:1};
    render();
  }
});
function kgUpdate(d){
  const kg=d.graph||d.knowledge_graph; return kg?kgSvg(kg):"";
}

/* #29 severity treemap — squarified enough to read at a glance. */
function treemap(counts, title){
  const items=Object.entries(counts||{}).filter(([,v])=>v>0)
    .sort((a,b)=>b[1]-a[1]);
  if(!items.length) return "";
  const total=items.reduce((n,[,v])=>n+v,0), W=100, H=52;
  let x=0;
  const colour=k=>({critical:"var(--crit)",high:"var(--high)",
    medium:"var(--med)",low:"var(--low)"}[k]||"var(--muted)");
  return `<div class="card" style="margin-bottom:13px"><h3>${esc(title)}</h3>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px" preserveAspectRatio="none">
    ${items.map(([k,v])=>{ const w=W*v/total, r=`<g>
        <rect x="${x}" y="0" width="${w}" height="${H}" fill="${colour(k)}"
          opacity=".8" stroke="var(--bg)" stroke-width="0.6"/>
        ${w>11?`<text x="${x+w/2}" y="${H/2-2}" text-anchor="middle" font-size="5"
          fill="#0a0d13" font-weight="700">${esc(k)}</text>
        <text x="${x+w/2}" y="${H/2+6}" text-anchor="middle" font-size="6"
          fill="#0a0d13" font-weight="700">${v}</text>`:""}</g>`; x+=w; return r;
      }).join("")}</svg></div>`;
}

/* #36 a sparkline any stat tile can carry. */
function sparkline(values, w=110, h=26){
  const v=(values||[]).filter(x=>typeof x==="number");
  if(v.length<2) return "";
  const max=Math.max(...v,1);
  const pts=v.map((n,i)=>`${(i/(v.length-1))*w},${h-(n/max)*(h-3)-1.5}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;margin-top:5px">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}

/* #28 port/service heatmap across hosts. */
function portHeatmap(results){
  const rows={};
  (results||[]).forEach(r=>{
    const d=r.data||{}; if(d.firewall_posture===undefined) return;
    const host=d.host||r.target;
    const open=(d.open_ports&&typeof d.open_ports==="object")?Object.keys(d.open_ports):[];
    rows[host]=open.map(k=>k.split("/")[0]);
  });
  const hosts=Object.keys(rows);
  if(!hosts.length) return "";
  const ports=[...new Set(Object.values(rows).flat())]
    .sort((a,b)=>(+a)-(+b)).slice(0,40);
  return `<div class="card" style="margin-bottom:13px"><h3>Open-port heatmap</h3>
    <div class="tblwrap"><table><thead><tr><th>Host</th>
      ${ports.map(p=>`<th style="writing-mode:vertical-rl;padding:6px 2px">${esc(p)}</th>`).join("")}
    </tr></thead><tbody>${hosts.map(h=>`<tr><td class="num">${esc(h)}</td>
      ${ports.map(p=>`<td style="padding:3px;text-align:center;background:${
        rows[h].includes(p)?"rgba(255,93,99,.35)":"transparent"}">${
        rows[h].includes(p)?"●":""}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div></div>`;
}

/* #37 sankey-ish flow: severity -> module -> host, as stacked proportions. */
function severityFlow(findings){
  if(!(findings||[]).length) return "";
  const bySev={}, byMod={};
  findings.forEach(f=>{ bySev[f.severity]=(bySev[f.severity]||0)+1;
                        byMod[f.module]=(byMod[f.module]||0)+1; });
  const bar=(obj,colour)=>{
    const total=Object.values(obj).reduce((a,b)=>a+b,0)||1;
    let x=0;
    return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k,v],i)=>{
      const w=100*v/total, r=`<rect x="${x}" y="0" width="${w}" height="14"
        fill="${colour(k,i)}" opacity=".85"><title>${esc(k)}: ${v}</title></rect>`;
      x+=w; return r;
    }).join("");
  };
  const sevCol=k=>({critical:"var(--crit)",high:"var(--high)",medium:"var(--med)",
                    low:"var(--low)"}[k]||"var(--muted)");
  const palette=["#5cc9d8","#f0b545","#a68bf0","#41c48a","#6aa9ff","#ff934a",
                 "#ecc94b","#ff5d63","#7b8699","#5fa8d3","#a86b00","#c62630"];
  return `<div class="card" style="margin-bottom:13px"><h3>Where the findings come from</h3>
    <div class="eyebrow">by severity</div>
    <svg viewBox="0 0 100 14" preserveAspectRatio="none" style="width:100%;height:16px">
      ${bar(bySev, sevCol)}</svg>
    <div class="eyebrow" style="margin-top:9px">by module</div>
    <svg viewBox="0 0 100 14" preserveAspectRatio="none" style="width:100%;height:16px">
      ${bar(byMod,(k,i)=>palette[i%palette.length])}</svg>
    <div class="note">Hover a band for its label and count.</div></div>`;
}

/* #31 where the addresses are, and #32 which networks own them.
   No map tiles — a CDN request per view would leak the target. */
function geoAndAsn(results){
  const geo={}, asn={};
  (results||[]).forEach(r=>{
    const flat={}; flatten(r.data,"",flat);
    Object.entries(flat).forEach(([k,v])=>{
      const kl=k.toLowerCase();
      if(/country|geo|location/.test(kl) && String(v).length<40)
        geo[String(v)]=(geo[String(v)]||0)+1;
      if(/\basn?\b|as_number|autonomous/.test(kl) && /AS?\d/i.test(String(v)))
        asn[String(v).slice(0,60)]=(asn[String(v).slice(0,60)]||0)+1;
    });
  });
  const block=(obj,title)=>{
    const items=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,12);
    if(!items.length) return "";
    const max=items[0][1];
    return `<div class="card" style="margin-bottom:13px"><h3>${esc(title)}</h3>
      ${items.map(([k,v])=>`<div style="margin-bottom:5px">
        <div style="display:flex;justify-content:space-between;font-size:11.5px">
          <span>${esc(k)}</span><span class="mono" style="color:var(--muted)">${v}</span></div>
        <div class="bar-h"><i style="width:${Math.round(100*v/max)}%"></i></div>
      </div>`).join("")}</div>`;
  };
  return block(geo,"Where the infrastructure sits") + block(asn,"Networks (ASN)");
}

/* #33 certificate chain, #34 response waterfall — read out of the scan. */
function certChain(results){
  const cert=(results||[]).find(r=>{
    const d=r.data||{}; return d.issuer || d.subject || d.chain; });
  if(!cert) return "";
  const d=cert.data||{};
  const chain=Array.isArray(d.chain)?d.chain:[d.subject, d.issuer].filter(Boolean);
  if(!chain.length) return "";
  return `<div class="card" style="margin-bottom:13px"><h3>Certificate chain</h3>
    ${chain.map((c,i)=>`<div style="display:flex;gap:10px;align-items:center;
        padding:7px 0;${i?"border-top:1px solid var(--line)":""}">
      <span class="pill ${i?"muted":"ok"}">${i?"issuer":"leaf"}</span>
      <span class="mono" style="word-break:break-all">${esc(
        typeof c==="object"?JSON.stringify(c):c)}</span></div>`).join("")}
    ${d.not_after?`<div class="note">Expires ${esc(d.not_after)}</div>`:""}</div>`;
}
function waterfall(results){
  const rows=(results||[]).map(r=>({m:r.module, ms:+(r.elapsed_ms||0)}))
    .filter(r=>r.ms>0);
  if(rows.length<2) return "";
  const total=rows.reduce((n,r)=>n+r.ms,0);
  let acc=0;
  return `<div class="card" style="margin-bottom:13px"><h3>Request waterfall</h3>
    <svg viewBox="0 0 100 ${rows.length*4+2}" style="width:100%;height:${
      Math.min(320, rows.length*10)}px" preserveAspectRatio="none">
    ${rows.map((r,i)=>{ const x=100*acc/total, w=Math.max(0.6,100*r.ms/total);
      acc+=r.ms;
      return `<rect x="${x}" y="${i*4}" width="${w}" height="3" fill="var(--accent)"
        opacity=".8"><title>${esc(r.m)}: ${(r.ms/1000).toFixed(2)}s</title></rect>`;
    }).join("")}</svg>
    <div class="note">Sequential position and share of the total; hover for the
      module and its duration.</div></div>`;
}

/* #27 attack paths — reachable exposure leading to something exploitable. */
function attackPaths(fix, ports, csp){
  const steps=[];
  const act=(fix&&fix.act_now)||[];
  act.forEach(a=>steps.push({
    head:`${a.cve} on ${(a.hosts||[]).join(", ")||"a host"}`,
    path:[`${a.reachability}`, a.exploitation, "→ exploited in the wild"]}));
  if(!steps.length && fix && (fix.fix_order||[]).length){
    const top=fix.fix_order[0];
    steps.push({head:`${top.cve} (highest ranked)`,
      path:[top.reachability, top.exploitation]});
  }
  if(!steps.length) return "";
  return `<div class="card" style="margin-bottom:13px">
    <h3>Attack paths <span class="tag">reachable + exploitable</span></h3>
    ${steps.slice(0,6).map(s=>`<div style="margin-bottom:11px">
      <b>${esc(s.head)}</b>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:5px">
        ${s.path.map(p=>`<span class="pill ${/wild|confirmed/.test(p)?"critical":"muted"}">${esc(p)}</span>`).join(
          `<span style="color:var(--faint)">→</span>`)}
      </div></div>`).join("")}
    <div class="note">Built from what the scan observed, not from a model of
      your network — a path shown here is one this scan can evidence.</div></div>`;
}

         :`<div class="note">The sweep returned no inline images — they are
