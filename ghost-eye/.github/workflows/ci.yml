name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test/runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest dnspython requests
          pip install ruff

      - name: Import check (every module registers cleanly)
        run: |
          python -c "import ghost_eye.modules; from ghost_eye.core import REGISTRY; print(len(REGISTRY), 'modules'); assert len(REGISTRY) > 0"

      - name: Byte-compile all sources
        run: python -m compileall -q ghost_eye

      - name: Run tests (unit + all-module smoke test)
        run: python -m pytest -q

      - name: Verification gate (compile, import, lint, tests, live smoke)
        run: bash scripts/verify.sh

      # `|| true` made these decorative: ruff and mypy could fail and CI stayed
      # green, which is the same as not running them except it looks like you
      # do. Bug rules block; style rules stay advisory, because a build that
      # fails on line length teaches people to ignore the build.
      - name: Lint (bug rules — blocking)
        run: ruff check ghost_eye --select F,E9,PLE,B

      - name: Lint (style — advisory)
        run: ruff check ghost_eye || true

      - name: Type-check (advisory)
        run: |
          pip install mypy
          mypy ghost_eye/core.py ghost_eye/config.py || true
